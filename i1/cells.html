<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; color: #ccc; touch-action: none; }
canvas#canvas { position: fixed; top: 38px; left: 0; width: 100vw; height: calc(100vh - 38px); display: block; cursor: crosshair; touch-action: none; }

#toolIndicator {

/* panels */
.panel {

}

#statsPanel { left: 6px; }
.panel h3 { font-size: 14px; margin-bottom: 8px; color: #ddd; display: flex; justify-content: space-between; align-items: center; }

.srow { display: flex; align-items: center; gap: 6px; margin: 4px 0; justify-content: space-between; }

.stline { display: flex; justify-content: space-between; padding: 1px 0; }

#statsPanel canvas { width: 100%; height: 110px; display: block; margin: 4px 0 8px; border-radius: 4px; }

/* итоги */
#summary { position: fixed; inset: 0; background: rgba(0,0,6,0.94); z-index: 300; display: none; overflow-y: auto; }
.sumHead { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: rgba(8,8,14,0.97); border-bottom: 1px solid #333; }

<script>
'use strict';
// ───────── config.js ─────────
// ==================== CONFIG ====================
// Клетки 4 — итерация Claude. Все настройки живут в объекте S и описаны таблицей SETTING_DEFS:
// UI-панель настроек строится из неё автоматически, так что новая настройка = одна строка.

const VERSION = 'Claude-1';

const GENE_NAMES = ['Сила', 'Броня', 'Реген', 'Смелость', 'Стайность', 'Прожорливость'];

// Архетипы из cells.jsx: индекс = сила*9 + броня*3 + реген, уровни 30 / 155 / 235
const LV = [30, 155, 235];
const ARCH_NAMES = [
  'Личинка', 'Слизень', 'Пожиратель', 'Чешуйка', 'Стойкий', 'Мицелий', 'Танк', 'Бастион', 'Монолит',
  'Кусака', 'Охотник', 'Вампир', 'Воин', 'Солдат', 'Паразит', 'Страж', 'Хранитель', 'Феникс',
  'Шершень', 'Хищник', 'Чума', 'Берсерк', 'Командир', 'Вирус', 'Колосс', 'Левиафан', 'Абсолют',
];

const SETTING_DEFS = [
  // group, key, label, type, min, max, step, def, restart(↻ — применится при перезапуске мира)
  { g: 'Спавн', key: 'initCells', label: 'Клеток в начале', type: 'number', min: 0, max: 3000, step: 1, def: 40, restart: true },
  { g: 'Спавн', key: 'initRadius', label: 'Радиус начального спавна', type: 'range', min: 20, max: 1500, step: 10, def: 260, restart: true },
  { g: 'Спавн', key: 'spawnMode', label: 'Тип спавна', type: 'select', def: 'random',
    options: [['random', 'Случайные (в радиусе рандомизации)'], ['exact', 'Точный геном']] },
  { g: 'Спавн', key: 'spawnSpread', label: 'Радиус рандомизации генов', type: 'range', min: 0, max: 255, step: 1, def: 255 },
  { g: 'Спавн', key: 'spawnCount', label: 'Клеток за клик', type: 'range', min: 1, max: 60, step: 1, def: 1 },
  { g: 'Спавн', key: 'spawnRadius', label: 'Радиус спавна кликом', type: 'range', min: 0, max: 400, step: 5, def: 40 },

  { g: 'Растения', key: 'initPlants', label: 'Растений в начале', type: 'number', min: 0, max: 5000, step: 1, def: 150, restart: true },
  { g: 'Растения', key: 'plantRate', label: 'Рейт спавна (шт/с)', type: 'range', min: 0, max: 30, step: 0.5, def: 3 },
  { g: 'Растения', key: 'plantEnergy', label: 'Жирность растений', type: 'range', min: 5, max: 150, step: 1, def: 28 },
  { g: 'Растения', key: 'plantMax', label: 'Лимит растений', type: 'range', min: 100, max: 6000, step: 50, def: 1800 },

  { g: 'Источники', key: 'initSources', label: 'Источников в начале', type: 'number', min: 0, max: 100, step: 1, def: 5, restart: true },
  { g: 'Источники', key: 'sourceRate', label: 'Рейт источника (шт/с)', type: 'range', min: 0, max: 10, step: 0.1, def: 1.2 },
  { g: 'Источники', key: 'sourceRadius', label: 'Радиус спавна растений', type: 'range', min: 10, max: 300, step: 5, def: 70 },
  { g: 'Источники', key: 'sourceFat', label: 'Жирность от источника ×', type: 'range', min: 0.2, max: 4, step: 0.1, def: 1 },

  { g: 'Бой', key: 'dmgMult', label: 'Множитель урона', type: 'range', min: 0.1, max: 5, step: 0.1, def: 1 },
  { g: 'Бой', key: 'critChance', label: 'Базовый шанс крита', type: 'range', min: 0, max: 1, step: 0.01, def: 0.15 },
  { g: 'Бой', key: 'knockMult', label: 'Откидывание ×', type: 'range', min: 0, max: 4, step: 0.1, def: 1 },
  { g: 'Бой', key: 'hardDmg', label: 'Хард-урон включён', type: 'bool', def: true },
  { g: 'Бой', key: 'hardMax', label: 'Макс. хард-зона (доля HP)', type: 'range', min: 0.1, max: 0.95, step: 0.05, def: 0.65 },
  { g: 'Бой', key: 'hardHealCost', label: 'Цена лечения хард-урона ×', type: 'range', min: 1, max: 40, step: 1, def: 10 },

  { g: 'Энергия и эволюция', key: 'hungerMult', label: 'Уровень голода ×', type: 'range', min: 0, max: 4, step: 0.1, def: 1 },
  { g: 'Энергия и эволюция', key: 'starveDmg', label: 'Урон от голода (HP/с)', type: 'range', min: 0, max: 60, step: 1, def: 18 },
  { g: 'Энергия и эволюция', key: 'reproChance', label: 'Шанс размножения ×', type: 'range', min: 0, max: 5, step: 0.1, def: 1 },
  { g: 'Энергия и эволюция', key: 'mutationMult', label: 'Сила мутаций ×', type: 'range', min: 0, max: 4, step: 0.1, def: 1 },
  { g: 'Энергия и эволюция', key: 'meatYield', label: 'Выход мяса ×', type: 'range', min: 0, max: 3, step: 0.1, def: 1 },
  { g: 'Энергия и эволюция', key: 'maxCells', label: 'Лимит клеток', type: 'range', min: 50, max: 4000, step: 50, def: 1500 },
  { g: 'Энергия и эволюция', key: 'plantNerf', label: 'Трава глушит реген', type: 'bool', def: true },

  { g: 'ИИ и физика', key: 'sight', label: 'Дальность зрения', type: 'range', min: 100, max: 900, step: 10, def: 350 },
  { g: 'ИИ и физика', key: 'aggression', label: 'Агрессивность ×', type: 'range', min: 0, max: 3, step: 0.1, def: 1 },
  { g: 'ИИ и физика', key: 'sociality', label: 'Общительность ×', type: 'range', min: 0, max: 3, step: 0.1, def: 1 },
  { g: 'ИИ и физика', key: 'speedMult', label: 'Скорость клеток ×', type: 'range', min: 0.3, max: 3, step: 0.1, def: 1 },

  { g: 'Мир', key: 'worldW', label: 'Ширина мира', type: 'number', min: 500, max: 10000, step: 100, def: 2000, restart: true },
  { g: 'Мир', key: 'worldH', label: 'Высота мира', type: 'number', min: 500, max: 10000, step: 100, def: 1500, restart: true },
  { g: 'Мир', key: 'cellSize', label: 'Размер клетки', type: 'range', min: 5, max: 30, step: 1, def: 12 },

  { g: 'Графика', key: 'particles', label: 'Активность частиц', type: 'range', min: 0, max: 3, step: 0.25, def: 1 },
  { g: 'Графика', key: 'heartbeat', label: 'Сердцебиение клеток', type: 'bool', def: true },
  { g: 'Графика', key: 'hpBars', label: 'Полоски HP', type: 'bool', def: true },
  { g: 'Графика', key: 'combatLines', label: 'Линии целей и товарищей', type: 'bool', def: true },
  { g: 'Графика', key: 'worldGrid', label: 'Сетка мира', type: 'bool', def: true },
];

const S = {};
for (const d of SETTING_DEFS) S[d.key] = d.def;
S.spawnGenome = [128, 128, 128, 128, 128, 128];

const SETTINGS_KEY = 'cells4.claude.settings.v1';

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    for (const d of SETTING_DEFS) {
      if (!(d.key in saved)) continue;
      const v = saved[d.key];
      if (d.type === 'bool') S[d.key] = !!v;
      else if (d.type === 'select') { if (d.options.some(o => o[0] === v)) S[d.key] = v; }
      else if (typeof v === 'number' && isFinite(v)) S[d.key] = clamp(v, d.min, d.max);
    }
    if (Array.isArray(saved.spawnGenome) && saved.spawnGenome.length === 6)
      S.spawnGenome = saved.spawnGenome.map(b => clamp(Math.round(+b) || 0, 0, 255));
  } catch (e) { /* localStorage может быть недоступен — не страшно */ }
}

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
}

function resetSettings() {
  for (const d of SETTING_DEFS) S[d.key] = d.def;
  S.spawnGenome = [128, 128, 128, 128, 128, 128];
  try { localStorage.removeItem(SETTINGS_KEY); } catch (e) { /* ignore */ }
}

// ==================== HELPERS ====================
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// Цвет тела: красный = сила, синий = броня, зелёный = реген  →  rgb(сила, реген, броня)
function bodyColor(g) { return `rgb(${g[0]},${g[2]},${g[1]})`; }
// Цвет ядра: красный = смелость, синий = стайность, зелёный = прожорливость
function nucleusColor(g) { return `rgb(${g[3]},${g[5]},${g[4]})`; }

function genomeSimilarity(a, b) {
  let diff = 0;
  for (let i = 0; i < 6; i++) diff += Math.abs(a[i] - b[i]);
  return 1 - diff / (255 * 6);
}

function randomGenome() { return Array.from({ length: 6 }, () => Math.floor(Math.random() * 256)); }

// ───────── world.js ─────────
// ==================== WORLD STATE ====================

const world = { w: 2000, h: 1500 };

let cells = [];
let plants = [];
let meats = [];      // ошмётки убитых клеток
let particles = [];
let walls = [];      // палки: { x1, y1, x2, y2, r }
let sources = [];    // точки спавна растений
let simTime = 0;
let nextId = 1;
let paused = false;
let timeScale = 1;

// Всё, что считает статистика и показывает итоговый экран
const stats = {
  kills: 0, births: 0, starve: 0, erased: 0, spawned: 0,
  maxAge: 0, maxAgeId: 0, maxKills: 0, maxKillsId: 0, maxKids: 0, maxKidsId: 0, maxGen: 0,
};

// ==================== SPATIAL GRID ====================
// Равномерная сетка корзин. Используется для клеток, растений и мяса,
// чтобы ИИ не перебирал весь мир, а смотрел только в окрестности.
class Grid {
  constructor(cs) { this.cs = cs; this.gw = 1; this.gh = 1; this.b = [[]]; this.used = []; }
  resize(w, h) {
    this.gw = Math.ceil(w / this.cs) + 1;
    this.gh = Math.ceil(h / this.cs) + 1;
    this.b = new Array(this.gw * this.gh);
    for (let i = 0; i < this.b.length; i++) this.b[i] = [];
    this.used.length = 0;
  }
  clear() {
    for (let k = 0; k < this.used.length; k++) this.b[this.used[k]].length = 0;
    this.used.length = 0;
  }
  add(o) {
    let gx = (o.x / this.cs) | 0, gy = (o.y / this.cs) | 0;
    if (gx < 0) gx = 0; else if (gx >= this.gw) gx = this.gw - 1;
    if (gy < 0) gy = 0; else if (gy >= this.gh) gy = this.gh - 1;
    const i = gy * this.gw + gx;
    const arr = this.b[i];
    if (arr.length === 0) this.used.push(i);
    arr.push(o);
  }
  // Все объекты из корзин, пересекающих квадрат со стороной 2r (грубо, без точной проверки расстояния)
  collect(x, y, r, out) {
    out.length = 0;
    const cs = this.cs;
    const x0 = Math.max(0, ((x - r) / cs) | 0), x1 = Math.min(this.gw - 1, ((x + r) / cs) | 0);
    const y0 = Math.max(0, ((y - r) / cs) | 0), y1 = Math.min(this.gh - 1, ((y + r) / cs) | 0);
    for (let gy = y0; gy <= y1; gy++) {
      const row = gy * this.gw;
      for (let gx = x0; gx <= x1; gx++) {
        const arr = this.b[row + gx];
        for (let k = 0; k < arr.length; k++) out.push(arr[k]);
      }
    }
    return out;
  }
  // Ближайший живой объект в радиусе r, удовлетворяющий pred
  nearest(x, y, r, pred) {
    const cs = this.cs;
    const x0 = Math.max(0, ((x - r) / cs) | 0), x1 = Math.min(this.gw - 1, ((x + r) / cs) | 0);
    const y0 = Math.max(0, ((y - r) / cs) | 0), y1 = Math.min(this.gh - 1, ((y + r) / cs) | 0);
    let best = null, bestD = r * r;
    for (let gy = y0; gy <= y1; gy++) {
      const row = gy * this.gw;
      for (let gx = x0; gx <= x1; gx++) {
        const arr = this.b[row + gx];
        for (let k = 0; k < arr.length; k++) {
          const o = arr[k];
          if (!o.alive) continue;
          const dx = o.x - x, dy = o.y - y, d2 = dx * dx + dy * dy;
          if (d2 < bestD && (!pred || pred(o))) { bestD = d2; best = o; }
        }
      }
    }
    return best;
  }
}

const cellGrid = new Grid(100);
const plantGrid = new Grid(100);
const meatGrid = new Grid(100);

function rebuildGrids() {
  cellGrid.clear(); plantGrid.clear(); meatGrid.clear();
  for (const c of cells) if (c.alive) cellGrid.add(c);
  for (const p of plants) if (p.alive) plantGrid.add(p);
  for (const m of meats) if (m.alive) meatGrid.add(m);
}

// ==================== LINEAGE ====================
// Родословная: id → { id, parent, children[], cell, gen }. Хранится и для умерших,
// чтобы подсвечивать живых предков/потомков через мёртвых промежуточных.
const lineage = new Map();
const LINEAGE_CAP = 40000;

function pruneLineage() {
  if (lineage.size <= LINEAGE_CAP) return;
  for (const [id, rec] of lineage) {
    if (!rec.cell) lineage.delete(id);
    if (lineage.size <= LINEAGE_CAP * 0.8) break;
  }
}

// Средние гены по поколениям (при рождении) — для графиков эволюции
const genAcc = [];
function recordGeneration(gen, genome) {
  let a = genAcc[gen];
  if (!a) a = genAcc[gen] = { n: 0, sum: [0, 0, 0, 0, 0, 0] };
  a.n++;
  for (let i = 0; i < 6; i++) a.sum[i] += genome[i];
  if (gen > stats.maxGen) stats.maxGen = gen;
}

// ==================== CELL ====================
function createCell(x, y, genome, parent) {
  const g = (genome || randomGenome()).slice();
  const strength = g[0], armor = g[1], regen = g[2];
  const mass = 1 + armor / 255 * 1.8;
  const maxHp = 90 + armor * 0.6;
  const maxEnergy = 140 + strength * 0.4;
  const gen = parent ? parent.gen + 1 : 0;

  const c = {
    id: nextId++,
    x, y, vx: 0, vy: 0,
    radius: S.cellSize,
    genome: g,
    color: bodyColor(g), nucColor: nucleusColor(g),
    // тело
    strength, armor, regen,
    // ядро
    courage: g[3], sociability: g[4], greed: g[5],
    // физиология
    mass, maxHp, hp: maxHp, hardHp: 0,
    maxEnergy, energy: maxEnergy * 0.7,
    speed: (300 - armor * 0.5) / mass,
    attackDamage: 6 + strength / 255 * 40,
    attackCooldown: 0.25 + strength / 255 * 1.4,
    knockback: 60 + strength * 0.15,
    regenRate: regen / 255 * 38,
    baseUpkeep: 1.2 + regen / 255 * 1.5 + (regen > 150 ? 0.5 : 0),
    // состояние
    alive: true, age: 0, gen,
    parent: parent ? parent.id : null,
    children: [],
    kills: 0,
    attackTimer: 0,
    combatTimer: 99,        // секунд с последнего боя
    lastAttacker: null, lastAttackedAt: -99,
    lastHitAt: -99,
    meatEaten: 0, plantEaten: 0,
    // ИИ
    task: 'idle', taskTarget: null, teammate: null,
    thinkTimer: Math.random() * 0.15,
    huntSince: 0, huntCooldownUntil: 0, retreatUntil: 0,
    route: [],              // [x0,y0,x1,y1,...] — путь к цели, последняя пара — сама цель
    near: [],               // соседи в зоне видимости (обновляется в think)
    nobst: [],              // препятствия поблизости (обновляется в think)
    wanderAngle: Math.random() * Math.PI * 2, wanderTimer: 0,
    dancePhase: Math.random() * 6.28,
    fleeX: x, fleeY: y,
    pressX: 0, pressY: 0, press: false,
    kiting: false,
    // визуал
    heartTimer: Math.random() * 3, pulse: 0,
  };

  recordGeneration(gen, g);
  const rec = { id: c.id, parent: c.parent, children: [], cell: c, gen };
  lineage.set(c.id, rec);
  if (parent) {
    const pr = lineage.get(parent.id);
    if (pr) pr.children.push(c.id);
    parent.children.push(c.id);
  }
  return c;
}

function refreshCellRadius() { for (const c of cells) c.radius = S.cellSize; }

// ==================== PLANTS / MEAT / SOURCES ====================
function createPlant(x, y, fat) {
  return {
    x, y, radius: 3.5 + Math.random() * 2.5, alive: true,
    energy: S.plantEnergy * (0.5 + Math.random() * 0.5) * (fat || 1),
  };
}

function createSource(x, y) {
  return { id: nextId++, x, y, r: 18, spawnTimer: Math.random(), alive: true, spawned: 0 };
}

// Ошмётки: чем больше у клетки было энергии, тем их больше и тем они жирнее
function spawnMeatDrops(c) {
  const ratio = clamp(c.energy / c.maxEnergy, 0, 1);
  const count = Math.floor(2 + ratio * 15);
  const total = Math.max(0, c.energy) * S.meatYield;
  if (total < 1) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 30 + Math.random() * 110;
    const life = 90 + ratio * 120 + Math.random() * 40;
    meats.push({
      x: c.x + Math.cos(a) * (c.radius * 0.6), y: c.y + Math.sin(a) * (c.radius * 0.6),
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      radius: 2.5 + ratio * 3 + Math.random() * 1.5,
      energy: Math.max(3, (total / count) * (0.5 + Math.random())),
      life, maxLife: life, alive: true,
      r: 170 + Math.floor(c.genome[0] * 0.33), gb: 25 + Math.floor(c.genome[2] * 0.2),
    });
  }
  if (meats.length > 2500) meats.splice(0, meats.length - 2500);
}

// ==================== PARTICLES ====================
function spawnParticles(x, y, count, color, life, speed, size) {
  count = Math.round(count * S.particles);
  if (count <= 0) return;
  const cap = 1500 * S.particles + 200;
  if (particles.length > cap) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: life * (0.5 + Math.random() * 0.5), maxLife: life,
      color, size: size || (1 + Math.random() * 2),
    });
  }
}

function resetWorldState() {
  cells = []; plants = []; meats = []; particles = []; walls = []; sources = [];
  lineage.clear(); genAcc.length = 0;
  simTime = 0; nextId = 1;
  for (const k in stats) stats[k] = 0;
  world.w = S.worldW; world.h = S.worldH;
  cellGrid.resize(world.w, world.h); plantGrid.resize(world.w, world.h); meatGrid.resize(world.w, world.h);
  obst.length = 0; buildObstGrid(); obstDirty = true;
}

// ───────── nav.js ─────────
// ==================== NAVIGATION ====================
// Препятствия — «палки» (капсулы) и источники (круги = вырожденные капсулы).
// Маршрут строится жадно: если прямая до цели упирается в препятствие,
// клетка выбирает ближайший угол обхода и повторяет это для остатка пути.

let obst = [];          // { x1,y1,x2,y2,r }
let obstDirty = true;

function rebuildObstacles() {
  obst.length = 0;
  for (const w of walls) obst.push(w);
  for (const s of sources) if (s.alive) obst.push({ x1: s.x, y1: s.y, x2: s.x, y2: s.y, r: s.r, src: s });
  buildObstGrid();
  obstDirty = false;
}

// Крупная сетка препятствий: запросы «что рядом с этим отрезком» не перебирают все палки мира
const OG = 150;
let ogW = 1, ogH = 1, ogCells = [], ogStamp = 0;
const _ob = [];

function buildObstGrid() {
  ogW = Math.ceil(world.w / OG) + 1; ogH = Math.ceil(world.h / OG) + 1;
  ogCells = new Array(ogW * ogH).fill(null);
  for (const o of obst) {
    const x0 = clamp(((Math.min(o.x1, o.x2) - o.r) / OG) | 0, 0, ogW - 1), x1 = clamp(((Math.max(o.x1, o.x2) + o.r) / OG) | 0, 0, ogW - 1);
    const y0 = clamp(((Math.min(o.y1, o.y2) - o.r) / OG) | 0, 0, ogH - 1), y1 = clamp(((Math.max(o.y1, o.y2) + o.r) / OG) | 0, 0, ogH - 1);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
      const i = gy * ogW + gx;
      (ogCells[i] || (ogCells[i] = [])).push(o);
    }
  }
}

// Уникальные препятствия, чьи корзины пересекают прямоугольник
function obstInBox(x0, y0, x1, y1, out) {
  out.length = 0;
  if (obst.length === 0) return out;
  ogStamp++;
  const gx0 = clamp((x0 / OG) | 0, 0, ogW - 1), gx1 = clamp((x1 / OG) | 0, 0, ogW - 1);
  const gy0 = clamp((y0 / OG) | 0, 0, ogH - 1), gy1 = clamp((y1 / OG) | 0, 0, ogH - 1);
  for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
    const arr = ogCells[gy * ogW + gx];
    if (!arr) continue;
    for (let k = 0; k < arr.length; k++) {
      const o = arr[k];
      if (o.q !== ogStamp) { o.q = ogStamp; out.push(o); }
    }
  }
  return out;
}

// ---------- геометрия ----------
function distPointSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

function segsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  const d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
  const d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}

function segSegDist(ax, ay, bx, by, cx, cy, dx, dy) {
  if (segsIntersect(ax, ay, bx, by, cx, cy, dx, dy)) return 0;
  return Math.min(
    distPointSeg(ax, ay, cx, cy, dx, dy), distPointSeg(bx, by, cx, cy, dx, dy),
    distPointSeg(cx, cy, ax, ay, bx, by), distPointSeg(dx, dy, ax, ay, bx, by));
}

const _ib = [];
function insideObstacle(x, y, margin) {
  if (obst.length === 0) return false;
  const list = obstInBox(x - margin, y - margin, x + margin, y + margin, _ib);
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    if (distPointSeg(x, y, o.x1, o.y1, o.x2, o.y2) < o.r + margin) return true;
  }
  return false;
}

function inBounds(x, y, m) { return x >= m && x <= world.w - m && y >= m && y <= world.h - m; }

// Ближайшая допустимая точка рядом с (x,y): не внутри препятствия и не за границей мира
function findFreePos(x, y, margin) {
  if (inBounds(x, y, margin) && !insideObstacle(x, y, margin)) return { x, y, ok: true };
  for (let k = 0; k < 60; k++) {
    const a = k * 0.7, d = 6 + k * 3;
    const nx = x + Math.cos(a) * d, ny = y + Math.sin(a) * d;
    if (inBounds(nx, ny, margin) && !insideObstacle(nx, ny, margin)) return { x: nx, y: ny, ok: true };
  }
  return { x, y, ok: false };
}

// ---------- маршрут ----------
const _fb = [];
function firstBlocker(sx, sy, tx, ty, clear) {
  let best = null, bestD = Infinity;
  const list = obstInBox(Math.min(sx, tx) - clear - 8, Math.min(sy, ty) - clear - 8, Math.max(sx, tx) + clear + 8, Math.max(sy, ty) + clear + 8, _fb);
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    if (segSegDist(sx, sy, tx, ty, o.x1, o.y1, o.x2, o.y2) < o.r + clear) {
      const d = distPointSeg(sx, sy, o.x1, o.y1, o.x2, o.y2);
      if (d < bestD) { bestD = d; best = o; }
    }
  }
  return best;
}

const _cand = [];
function detourCandidates(o, sx, sy, R) {
  _cand.length = 0;
  const dx = o.x2 - o.x1, dy = o.y2 - o.y1, L = Math.hypot(dx, dy);
  if (L < 1) {
    // круг: две точки по бокам относительно направления «от клетки к центру»
    let ux = o.x1 - sx, uy = o.y1 - sy;
    const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
    _cand.push(o.x1 - uy * R, o.y1 + ux * R, o.x1 + uy * R, o.y1 - ux * R);
  } else {
    const ax = dx / L, ay = dy / L, px = -ay, py = ax;
    for (let e = 0; e < 2; e++) {
      const ex = e ? o.x2 : o.x1, ey = e ? o.y2 : o.y1, s = e ? 1 : -1;
      for (let side = -1; side <= 1; side += 2) {
        _cand.push(ex + (ax * s + px * side) * R * 0.72, ey + (ay * s + py * side) * R * 0.72);
      }
    }
  }
  return _cand;
}

function buildRoute(sx, sy, tx, ty, clear, out, depth) {
  const o = depth > 0 ? firstBlocker(sx, sy, tx, ty, clear) : null;
  if (!o) { out.push(tx, ty); return; }
  const R = (o.r + clear) * 1.5 + 4;
  const cand = detourCandidates(o, sx, sy, R);
  let bx = 0, by = 0, bestCost = Infinity;
  // клетка, прижатая к препятствию, уже ближе порога — требуем лишь не приближаться к нему
  const thr = Math.min((o.r + clear) * 0.85, distPointSeg(sx, sy, o.x1, o.y1, o.x2, o.y2) * 0.92);
  for (let i = 0; i < cand.length; i += 2) {
    const wx = cand[i], wy = cand[i + 1];
    if (Math.abs(wx - sx) + Math.abs(wy - sy) < 12) continue;      // не топчемся на месте
    if (!inBounds(wx, wy, 6) || insideObstacle(wx, wy, clear * 0.8)) continue;
    // первый отрезок не должен упираться в это же препятствие
    if (segSegDist(sx, sy, wx, wy, o.x1, o.y1, o.x2, o.y2) < thr) continue;
    const cost = Math.hypot(wx - sx, wy - sy) + Math.hypot(tx - wx, ty - wy);
    if (cost < bestCost) { bestCost = cost; bx = wx; by = wy; }
  }
  if (bestCost === Infinity) { out.push(tx, ty); return; }   // тупик — едем прямо, спасёт локальное отталкивание
  out.push(bx, by);
  buildRoute(bx, by, tx, ty, clear, out, depth - 1);
}

function planRoute(c, tx, ty) {
  const r = c.route;
  r.length = 0;
  if (obst.length === 0) { r.push(tx, ty); return; }
  // трусливые обходят препятствия дальше
  const clear = c.radius + 4 + (1 - c.courage / 255) * 14;
  buildRoute(c.x, c.y, tx, ty, clear, r, 3);
}

// Короткий список препятствий поблизости (обновляется в think) — чтобы физика не перебирала все палки мира
function refreshNearObstacles(c) {
  const list = c.nobst, R = c.radius + 130;
  list.length = 0;
  const cand = obstInBox(c.x - R, c.y - R, c.x + R, c.y + R, _nb);
  for (let i = 0; i < cand.length; i++) {
    const o = cand[i];
    if (c.x < Math.min(o.x1, o.x2) - o.r - R || c.x > Math.max(o.x1, o.x2) + o.r + R ||
        c.y < Math.min(o.y1, o.y2) - o.r - R || c.y > Math.max(o.y1, o.y2) + o.r + R) continue;
    list.push(o);
  }
}
const _nb = [];

// Локальное отталкивание от препятствий и границ мира (страховка, если маршрут не помог)
function localAvoid(c, out) {
  let rx = 0, ry = 0;
  const pad = c.radius + 10, list = c.nobst;
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    const lim = o.r + pad;
    if (c.x < Math.min(o.x1, o.x2) - lim || c.x > Math.max(o.x1, o.x2) + lim ||
        c.y < Math.min(o.y1, o.y2) - lim || c.y > Math.max(o.y1, o.y2) + lim) continue;
    // ближайшая точка на капсуле
    const sx = o.x2 - o.x1, sy = o.y2 - o.y1, l2 = sx * sx + sy * sy;
    let u = l2 > 0 ? ((c.x - o.x1) * sx + (c.y - o.y1) * sy) / l2 : 0;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const nx = c.x - (o.x1 + sx * u), ny = c.y - (o.y1 + sy * u);
    const d = Math.hypot(nx, ny);
    if (d < lim && d > 0.01) { const k = (1 - d / lim) * 2.5; rx += nx / d * k; ry += ny / d * k; }
  }
  const bm = 30;
  if (c.x < bm) rx += (1 - c.x / bm) * 2;
  if (c.x > world.w - bm) rx -= (1 - (world.w - c.x) / bm) * 2;
  if (c.y < bm) ry += (1 - c.y / bm) * 2;
  if (c.y > world.h - bm) ry -= (1 - (world.h - c.y) / bm) * 2;
  out.x = rx; out.y = ry;
}

// Куда лучше всего «выталкивать» цель ударами: к ближайшей стене/границе (для синих-танков)
const _pd = [];
function nearestPushDir(t, maxD) {
  let bd = maxD, nx = 0, ny = 0;
  // границы мира: расстояние и направление к границе
  if (t.x < bd) { bd = t.x; nx = -1; ny = 0; }
  if (world.w - t.x < bd) { bd = world.w - t.x; nx = 1; ny = 0; }
  if (t.y < bd) { bd = t.y; nx = 0; ny = -1; }
  if (world.h - t.y < bd) { bd = world.h - t.y; nx = 0; ny = 1; }
  const near = obstInBox(t.x - maxD, t.y - maxD, t.x + maxD, t.y + maxD, _pd);
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    const d = distPointSeg(t.x, t.y, o.x1, o.y1, o.x2, o.y2) - o.r;
    if (d < bd) {
      const sx = o.x2 - o.x1, sy = o.y2 - o.y1, l2 = sx * sx + sy * sy;
      let u = l2 > 0 ? ((t.x - o.x1) * sx + (t.y - o.y1) * sy) / l2 : 0;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const vx = o.x1 + sx * u - t.x, vy = o.y1 + sy * u - t.y, vl = Math.hypot(vx, vy) || 1;
      bd = d; nx = vx / vl; ny = vy / vl;
    }
  }
  return bd < maxD ? { nx, ny, d: bd } : null;
}

// ───────── ai.js ─────────
// ==================== AI ====================
// think() — редкое принятие решений (≈7 раз в секунду на клетку): выбирает задачу и цель.
// move()  — каждый тик: едет к цели по маршруту, держит дистанцию, обходит препятствия.
// Правила простые и нечёткие, а стаи, вожаки и тактики возникают сами.

const _tmp = [];
const _av = { x: 0, y: 0 };

function thinkInterval() { return 0.12 + Math.random() * 0.08; }

function retaliationTarget(c) {
  const a = c.lastAttacker;
  return a && a.alive && simTime - c.lastAttackedAt < 2.5 ? a : null;
}

// Оценка добычи: чем меньше, тем привлекательнее
function preyScore(c, o, d) {
  let s = d * (1 + o.armor / 255 * 0.8);
  if (o.hp < o.maxHp * 0.5) s *= 0.6;
  s *= 1 + Math.max(0, o.strength - c.strength) / 150;
  return s;
}

function pickPrey(c) {
  let best = null, bestS = Infinity;
  for (const o of c.near) {
    if (o === c.teammate) continue;
    // осторожные не лезут на заведомо более сильных
    if (o.strength - c.strength > 90 + c.courage * 0.6) continue;
    const d = Math.hypot(o.x - c.x, o.y - c.y);
    const s = preyScore(c, o, d);
    if (s < bestS) { bestS = s; best = o; }
  }
  return best;
}

function startHunt(c, target) {
  if (c.task !== 'hunt' || c.taskTarget !== target) c.huntSince = simTime;
  c.task = 'hunt'; c.taskTarget = target;
}

function huntStillValid(c, sight) {
  const t = c.taskTarget;
  if (!t || !t.alive || t === c.teammate) return false;
  const d = Math.hypot(t.x - c.x, t.y - c.y);
  if (d > sight * 1.5) return false;
  // охотник, который давно не попадает, бросает погоню
  if (simTime - Math.max(c.huntSince, c.lastHitAt) > 10) { c.huntCooldownUntil = simTime + 6; return false; }
  // умирающий от голода не гонится за далёкой целью
  if (c.energy < c.maxEnergy * 0.08 && d > 80) return false;
  return true;
}

function findFood(c, sight, meatPref, plantPenalty) {
  const free = o => !insideObstacle(o.x, o.y, c.radius + 1);
  const p = plantGrid.nearest(c.x, c.y, sight, free);
  const m = meatGrid.nearest(c.x, c.y, sight, free);
  if (!p && !m) return null;
  const pd = p ? Math.hypot(p.x - c.x, p.y - c.y) * (meatPref ? 1.5 : 1) * plantPenalty : Infinity;
  const md = m ? Math.hypot(m.x - c.x, m.y - c.y) * (meatPref ? 0.6 : 1.1) : Infinity;
  return md < pd ? m : p;
}

function tryTeamUp(c, ef) {
  if (c.teammate || ef < 0.4) return;
  const want = (c.sociability / 255) * S.sociality;
  if (c.sociability < 90 || Math.random() > want * 0.2) return;
  for (const o of c.near) {
    if (o.taskTarget === c || o.energy < o.maxEnergy * 0.4) continue;
    const sim = genomeSimilarity(c.genome, o.genome);
    if (sim < 0.45) continue;
    if ((c.sociability / 255) * (o.sociability / 255) * sim * S.sociality < 0.12) continue;
    c.teammate = o;
    return;
  }
}

function think(c) {
  const sight = S.sight;
  // охота закончена (жертва мертва) — короткая передышка, чтобы не вырезать всех подряд
  if (c.task === 'hunt' && c.taskTarget && !c.taskTarget.alive) {
    c.huntCooldownUntil = simTime + 3 + Math.random() * 4;
    c.task = 'idle'; c.taskTarget = null;
  }
  cellGrid.collect(c.x, c.y, sight, _tmp);
  refreshNearObstacles(c);
  const near = c.near; near.length = 0;
  let threat = null, threatD = Infinity;
  for (let i = 0; i < _tmp.length; i++) {
    const o = _tmp[i];
    if (o === c || !o.alive) continue;
    const d = Math.hypot(o.x - c.x, o.y - c.y);
    if (d >= sight) continue;
    near.push(o);
    if (o.task === 'hunt' && o.taskTarget === c && d < threatD) { threat = o; threatD = d; }
  }
  if (!threat) threat = retaliationTarget(c);

  const ef = c.energy / c.maxEnergy, hf = c.hp / c.maxHp;
  const greedy = c.greed / 255;
  const hungryThr = 0.3 + greedy * 0.45;               // прожорливые идут есть раньше
  const isHungry = ef < hungryThr;
  const veryHungry = ef < 0.22;
  // Смелые отступают при бóльших потерях HP; регенераторов потери пугают меньше
  const retreatThr = lerp(0.5, 0.1, c.courage / 255) * (1 - 0.35 * c.regen / 255);

  // ── Связи с товарищем ──
  if (c.teammate && (!c.teammate.alive || dist(c, c.teammate) > sight * 1.6 || (veryHungry && Math.random() < 0.08)))
    c.teammate = null;

  // ── 1. Отступление ──
  if (threat && (hf < retreatThr || (c.task === 'retreat' && hf < retreatThr + 0.15 && simTime < c.retreatUntil))) {
    if (c.task !== 'retreat') c.retreatUntil = simTime + 2.5;
    c.task = 'retreat'; c.taskTarget = threat;
    let fx = c.x - threat.x, fy = c.y - threat.y;
    const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
    for (const o of near) {
      const d = Math.hypot(c.x - o.x, c.y - o.y);
      if (d < 140 && d > 0 && o !== threat) { fx += (c.x - o.x) / d * (1 - d / 140) * 0.5; fy += (c.y - o.y) / d * (1 - d / 140) * 0.5; }
    }
    const l = Math.hypot(fx, fy) || 1;
    c.fleeX = clamp(c.x + fx / l * 240, 40, world.w - 40);
    c.fleeY = clamp(c.y + fy / l * 240, 40, world.h - 40);
    planRoute(c, c.fleeX, c.fleeY);
    return;
  }

  // ── 2. Ответить обидчику (даже если он «друг») ──
  const rt = retaliationTarget(c);
  if (rt && c.taskTarget !== rt && Math.hypot(rt.x - c.x, rt.y - c.y) < sight) {
    if (rt === c.teammate) c.teammate = null;
    startHunt(c, rt);
  }

  // ── 3. Продолжать начатую охоту (цель не меняется, пока её не убили или не перебили приоритеты) ──
  if (c.task === 'hunt' && huntStillValid(c, sight)) {
    planHunt(c);
    return;
  }

  // ── 4. Помочь товарищу: бить ту же цель / того, кто бьёт его ──
  const tm = c.teammate;
  if (tm && tm.alive) {
    const assist = tm.task === 'hunt' && tm.taskTarget && tm.taskTarget.alive && tm.taskTarget !== c
      ? tm.taskTarget : retaliationTarget(tm);
    if (assist && assist !== c && assist !== tm && Math.random() < (c.sociability / 255) * S.sociality * 0.6 &&
        simTime >= c.huntCooldownUntil && Math.hypot(assist.x - c.x, assist.y - c.y) < sight) {
      startHunt(c, assist); planHunt(c); return;
    }
  }

  // ── 5. Выйти на охоту ──
  // Смелость тянет в бой, стайность гасит беспричинную агрессию, голод злит
  const aggr = (c.courage / 255) * (1 - 0.55 * c.sociability / 255) * S.aggression;
  if (near.length && simTime >= c.huntCooldownUntil &&
      Math.random() < Math.pow(aggr * (isHungry ? 1.5 : 0.8), 1.5) * 0.14) {
    const prey = pickPrey(c);
    if (prey) { startHunt(c, prey); planHunt(c); return; }
  }

  // ── 6. Еда ──
  if (isHungry) {
    const meatPref = c.courage > 110 || c.regen > 150;
    let plantPenalty = 1;
    if (S.plantNerf && c.regen > 120) {
      const tot = c.meatEaten + c.plantEaten + 0.01;
      plantPenalty = 1 + (c.plantEaten / tot) * 1.5;   // регенераторы сами тянутся к мясу
    }
    let food = c.taskTarget && c.taskTarget.alive && (c.task === 'forage' || c.task === 'forage_meat') ? c.taskTarget : null;
    if (food && Math.hypot(food.x - c.x, food.y - c.y) > sight * 2.2) food = null;   // помним цель, пока обходим препятствие
    if (!food) food = findFood(c, sight, meatPref, plantPenalty);
    if (food) {
      c.task = food.life !== undefined ? 'forage_meat' : 'forage';
      c.taskTarget = food;
      planRoute(c, food.x, food.y);
      return;
    }
    // еды не видно: голодный отчаянно нападает на кого угодно, иначе ищет еду
    if (veryHungry && near.length && c.courage > 40) {
      const prey = pickPrey(c) || near[0];
      if (prey) { startHunt(c, prey); planHunt(c); return; }
    }
    c.task = 'explore'; c.taskTarget = null; c.route.length = 0;
    return;
  }

  // ── 7. Держаться товарища / завести товарища ──
  tryTeamUp(c, ef);
  if (c.teammate) {
    c.task = 'teamup'; c.taskTarget = c.teammate;
    planRoute(c, c.teammate.x, c.teammate.y);
    return;
  }

  // ── Ничего срочного: танцуем ──
  c.task = 'idle'; c.taskTarget = null; c.route.length = 0;
}

function planHunt(c) {
  const t = c.taskTarget;
  // Синие давят противника к стене/опасности: заходят с противоположной от неё стороны
  c.press = false;
  if (c.armor > 140) {
    const p = nearestPushDir(t, 260);
    if (p) { c.press = true; c.pressX = p.nx; c.pressY = p.ny; }
  }
  const touch = c.radius + t.radius + 4;
  const tx = c.press ? t.x - c.pressX * touch : t.x, ty = c.press ? t.y - c.pressY * touch : t.y;
  planRoute(c, tx, ty);
}

// ==================== MOVEMENT ====================
function liveGoal(c, g, dt) {
  // g — выходной объект {x, y, speed, hold}
  g.hold = false; g.speed = 1;
  switch (c.task) {
    case 'hunt': {
      const t = c.taskTarget;
      if (!t || !t.alive) return false;
      const dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy) || 1;
      const touch = c.radius + t.radius + 4;
      c.kiting = false;
      // Сильные (красные) бьют и отъезжают на КД, а не стоят в противнике
      if (c.strength > 110 && c.attackTimer > 0.2 && d < touch * 3) {
        c.kiting = true;
        g.x = c.x - dx / d * 100; g.y = c.y - dy / d * 100; g.speed = 0.85;
        return true;
      }
      if (c.press) { g.x = t.x - c.pressX * touch; g.y = t.y - c.pressY * touch; }
      else { g.x = t.x; g.y = t.y; }
      if (d < touch * 0.9) g.hold = true;     // уже вплотную — не проскакиваем сквозь
      return true;
    }
    case 'forage': case 'forage_meat': {
      const t = c.taskTarget;
      if (!t || !t.alive) return false;
      g.x = t.x; g.y = t.y; g.speed = 0.8; return true;
    }
    case 'retreat': g.x = c.fleeX; g.y = c.fleeY; return true;
    case 'teamup': {
      const t = c.taskTarget;
      if (!t || !t.alive) return false;
      const d = Math.hypot(t.x - c.x, t.y - c.y);
      g.x = t.x; g.y = t.y; g.speed = d > 160 ? 1 : 0.7;
      if (d < 55) g.hold = true;
      return true;
    }
    case 'explore': {
      c.wanderTimer -= dt;
      if (c.wanderTimer <= 0) { c.wanderAngle += (Math.random() - 0.5) * 1.6; c.wanderTimer = 1 + Math.random() * 2; }
      g.x = c.x + Math.cos(c.wanderAngle) * 120; g.y = c.y + Math.sin(c.wanderAngle) * 120;
      g.speed = 0.75; return true;
    }
    default: return false;
  }
}

const _goal = { x: 0, y: 0, speed: 1, hold: false };

function move(c, dt) {
  let dirX = 0, dirY = 0, moving = false, speedMul = 1, accelMul = 4;

  if (c.task === 'idle') {
    // Танец: ритмичное «туда-сюда», ядро пульсирует (см. рендер)
    c.dancePhase += dt * 5;
    c.wanderTimer -= dt;
    if (c.wanderTimer <= 0) { c.wanderAngle += (Math.random() - 0.5) * 2.2; c.wanderTimer = 1.5 + Math.random() * 2.5; }
    const s = Math.sin(c.dancePhase);
    dirX = Math.cos(c.wanderAngle) * s; dirY = Math.sin(c.wanderAngle) * s;
    moving = true; speedMul = 0.35; accelMul = 3;
  } else if (liveGoal(c, _goal, dt)) {
    let gx = _goal.x, gy = _goal.y;
    const r = c.route;
    if (r.length > 2 && !c.kiting) {             // есть промежуточные точки объезда
      if (Math.hypot(r[0] - c.x, r[1] - c.y) < 16) r.splice(0, 2);
      if (r.length > 2) { gx = r[0]; gy = r[1]; }
    }
    const dx = gx - c.x, dy = gy - c.y, d = Math.hypot(dx, dy) || 1;
    dirX = dx / d; dirY = dy / d;
    speedMul = _goal.speed;
    moving = !_goal.hold;
    if (c.task === 'explore' && (c.x < 60 || c.x > world.w - 60 || c.y < 60 || c.y > world.h - 60))
      c.wanderAngle = Math.atan2(world.h / 2 - c.y, world.w / 2 - c.x) + (Math.random() - 0.5);
    if (c.task === 'teamup' && !moving) { c.dancePhase += dt * 5; }
  }

  if (moving || c.task === 'hunt') {
    // Трусливые объезжают живность дальше
    const cow = 1 - c.courage / 255;
    if (cow > 0.2 && c.near.length) {
      const R0 = c.radius * 2 + cow * 60;
      let n = 0;
      for (const o of c.near) {
        if (o === c.taskTarget || o === c.teammate || !o.alive) continue;
        const ox = c.x - o.x, oy = c.y - o.y, od = Math.hypot(ox, oy);
        if (od < R0 && od > 0.1) { const k = (1 - od / R0) * cow * 1.8; dirX += ox / od * k; dirY += oy / od * k; }
        if (++n > 12) break;
      }
    }
    localAvoid(c, _av);
    dirX += _av.x; dirY += _av.y;
    const dl = Math.hypot(dirX, dirY);
    if (dl > 1) { dirX /= dl; dirY /= dl; }
  }

  const sp = c.speed * S.speedMult;
  if (moving) {
    c.vx += dirX * sp * accelMul * dt;
    c.vy += dirY * sp * accelMul * dt;
  }
  const v = Math.hypot(c.vx, c.vy), vmax = sp * speedMul;
  if (v > vmax) { c.vx *= vmax / v; c.vy *= vmax / v; }
  const fr = Math.pow(0.93, dt * 60);
  c.vx *= fr; c.vy *= fr;
  c.x += c.vx * dt; c.y += c.vy * dt;

  // стенки мира: просто не пускают
  const R = c.radius;
  if (c.x < R) { c.x = R; c.vx = Math.abs(c.vx) * 0.4; }
  if (c.x > world.w - R) { c.x = world.w - R; c.vx = -Math.abs(c.vx) * 0.4; }
  if (c.y < R) { c.y = R; c.vy = Math.abs(c.vy) * 0.4; }
  if (c.y > world.h - R) { c.y = world.h - R; c.vy = -Math.abs(c.vy) * 0.4; }

  // жёсткое выталкивание из палок и источников
  const nob = c.nobst;
  for (let i = 0; i < nob.length; i++) {
    const o = nob[i], lim = R + o.r;
    if (c.x < Math.min(o.x1, o.x2) - lim || c.x > Math.max(o.x1, o.x2) + lim ||
        c.y < Math.min(o.y1, o.y2) - lim || c.y > Math.max(o.y1, o.y2) + lim) continue;
    const sx = o.x2 - o.x1, sy = o.y2 - o.y1, l2 = sx * sx + sy * sy;
    let u = l2 > 0 ? ((c.x - o.x1) * sx + (c.y - o.y1) * sy) / l2 : 0;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const nx = c.x - (o.x1 + sx * u), ny = c.y - (o.y1 + sy * u), d = Math.hypot(nx, ny);
    if (d < lim) {
      let ux, uy;
      if (d > 0.001) { ux = nx / d; uy = ny / d; } else { ux = 1; uy = 0; }
      c.x = o.x1 + sx * u + ux * lim; c.y = o.y1 + sy * u + uy * lim;
      const dot = c.vx * ux + c.vy * uy;
      if (dot < 0) { c.vx -= dot * ux * 1.3; c.vy -= dot * uy * 1.3; }
    }
  }
}

// ───────── sim.js ─────────
// ==================== SIMULATION ====================
// Бой, энергия, размножение, спавн и главный шаг симуляции. Шаг фиксированный (1/30 с),
// ускорение времени = больше шагов за кадр, поэтому механики не ломаются на любой скорости.

const FIXED_DT = 1 / 30;

// ---------- хуки для модов ----------
const hooks = { tick: [], birth: [], death: [], hit: [], spawn: [] };
function emit(name, a, b, c, d) {
  const list = hooks[name];
  for (let i = 0; i < list.length; i++) {
    try { list[i](a, b, c, d); } catch (e) { console.error('[mod]', name, e); }
  }
}

// ---------- смерть ----------
function killCell(c, cause, killer) {
  if (!c.alive) return;
  c.alive = false;
  if (cause === 'kill') {
    stats.kills++;
    if (killer) {
      killer.kills++;
      if (killer.kills > stats.maxKills) { stats.maxKills = killer.kills; stats.maxKillsId = killer.id; }
    }
  } else if (cause === 'starve') stats.starve++;
  else stats.erased++;
  if (c.age > stats.maxAge) { stats.maxAge = c.age; stats.maxAgeId = c.id; }
  const rec = lineage.get(c.id);
  if (rec) rec.cell = null;
  spawnParticles(c.x, c.y, 20, c.color, 1.6, 95, 2.4);
  spawnParticles(c.x, c.y, 8, '#fff', 0.45, 55);
  if (cause !== 'erase') spawnMeatDrops(c);
  emit('death', c, cause, killer);
}

// ---------- бой ----------
function combat(c, dt) {
  c.attackTimer -= dt;
  c.combatTimer += dt;
  if (c.task !== 'hunt') return;
  const t = c.taskTarget;
  if (!t || !t.alive) return;
  const dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy);
  // Удар возможен только при касании и когда готов; кулдаун, а не зарядка — первый удар мгновенный
  if (d < c.radius + t.radius + 6 && c.attackTimer <= 0) attack(c, t, dx, dy, d);
}

function attack(c, t, dx, dy, d) {
  c.attackTimer = c.attackCooldown;
  c.combatTimer = 0; t.combatTimer = 0;
  c.lastHitAt = simTime;

  const pen = c.strength / 255, def = t.armor / 255;
  let dmg = c.attackDamage * S.dmgMult * (1 - def * 0.5);
  let crit = Math.random() < S.critChance * (1 + pen) * (1 - def * 0.7);
  if (def > 0.9 && pen < 0.3) { crit = false; dmg *= 0.3; }   // FULL BLOCK

  let knock = 1;
  if (crit) {
    dmg *= 2.5; knock = 2;
    if (S.hardDmg) t.hardHp = Math.min(t.maxHp * S.hardMax, t.hardHp + dmg * 0.28);
    spawnParticles(t.x, t.y, 14, '#ff2222', 0.7, 75, 2.6);
  } else {
    // добивание уже изувеченного усугубляет хард-зону
    if (S.hardDmg && t.hp < t.maxHp * 0.3 && pen > 0.3) t.hardHp = Math.min(t.maxHp * S.hardMax, t.hardHp + dmg * 0.08);
    spawnParticles(t.x, t.y, 5, '#ffaa44', 0.3, 34);
  }
  t.hp -= dmg;
  const cap = t.maxHp - t.hardHp;
  if (t.hp > cap) t.hp = cap;

  const kb = (c.knockback * knock * S.knockMult) / t.mass / (d || 1);
  t.vx += dx * kb; t.vy += dy * kb;

  t.lastAttacker = c; t.lastAttackedAt = simTime;
  if (t.teammate === c) t.teammate = null;
  if (c.teammate === t) c.teammate = null;
  emit('hit', c, t, dmg, crit);
  if (t.hp <= 0) killCell(t, 'kill', c);
}

// ---------- энергия и здоровье ----------
function economy(c, dt) {
  // пассивный расход, чуть больше при движении и в бою
  const sp = Math.hypot(c.vx, c.vy);
  let upkeep = (c.baseUpkeep + 0.5 * sp / (c.speed * S.speedMult + 1)) * S.hungerMult;
  if (c.combatTimer < 2) upkeep *= 1.3;
  c.energy -= upkeep * dt;

  // Реген: в бою сильно подавлен, но не выключен; после боя разгоняется тем быстрее, чем зеленее клетка
  const delay = 0.5 + 4.5 * (1 - c.regen / 255);
  const rf = c.combatTimer < 2 ? 0.15 : Math.min(1, 0.15 + 0.85 * (c.combatTimer - 2) / delay);
  let plantMult = 1;
  if (S.plantNerf && c.regen > 100) {
    const pr = c.plantEaten / (c.meatEaten + c.plantEaten + 0.01);
    if (pr > 0.5) plantMult = Math.max(0.12, 1 - (pr - 0.5) * 2 * (c.regen / 255) * 1.4);
  }
  const cap = c.maxHp - c.hardHp;
  if (c.hp > cap) c.hp = cap;
  if (c.hp < cap && c.regenRate > 0) {
    const rate = c.regenRate * rf * plantMult, cost = rate * 0.9 * dt;
    if (c.energy > cost) { c.hp = Math.min(cap, c.hp + rate * dt); c.energy -= cost; }
  }
  // Хард-урон лечится очень медленно, в разы дороже и только в покое
  if (c.hardHp > 0 && c.combatTimer > delay + 2) {
    const rate = c.regenRate * 0.08, cost = rate * dt * 0.9 * S.hardHealCost;
    if (rate > 0 && c.energy > cost * 3) {
      c.hardHp -= Math.min(rate * dt, c.hardHp);
      c.energy -= cost;
    }
  }

  // Подбор еды: любая клетка ест то, чего касается
  if (c.energy < c.maxEnergy * 0.97) {
    const m = meatGrid.nearest(c.x, c.y, c.radius + 8);
    if (m && Math.hypot(m.x - c.x, m.y - c.y) < c.radius + m.radius + 2) {
      c.energy = Math.min(c.maxEnergy, c.energy + m.energy);
      c.meatEaten += m.energy; m.alive = false;
      spawnParticles(m.x, m.y, 4, '#ff6644', 0.4, 20);
    }
    const p = plantGrid.nearest(c.x, c.y, c.radius + 8);
    if (p && Math.hypot(p.x - c.x, p.y - c.y) < c.radius + p.radius + 2) {
      c.energy = Math.min(c.maxEnergy, c.energy + p.energy);
      c.plantEaten += p.energy; p.alive = false;
      spawnParticles(p.x, p.y, 3, '#44ff44', 0.3, 15);
    }
  }

  // Энергия кончилась — начинает съедаться HP
  if (c.energy <= 0) {
    c.energy = 0;
    c.hp -= S.starveDmg * dt;
    if (c.hp <= 0) killCell(c, 'starve');
  }
  c.age += dt;
}

// ---------- размножение ----------
function maybeReproduce(c, dt) {
  if (cells.length >= S.maxCells) return;
  const ef = c.energy / c.maxEnergy, hf = c.hp / c.maxHp;
  // прожорливые хотят больше энергии про запас, прежде чем размножаться
  if (ef < 0.62 + c.greed / 255 * 0.3 || hf < 0.5 || c.hardHp > c.maxHp * 0.3) return;
  if (Math.random() < (0.12 + (1 - c.greed / 255) * 0.18) * S.reproChance * dt) reproduce(c);
}

function reproduce(c) {
  const condition = (c.hp / c.maxHp + c.energy / c.maxEnergy) / 2;
  c.energy -= c.maxEnergy * 0.6;
  // Чувствует себя хорошо — мутация слабая; плохо — сильнее: время рискнуть
  const mut = Math.max(0, Math.floor(((1 - condition) * 35 + 3) * S.mutationMult));
  const genome = c.genome.map(b => clamp(b + Math.floor((Math.random() - 0.5) * 2 * mut), 0, 255));
  const a = Math.random() * Math.PI * 2;
  const pos = findFreePos(c.x + Math.cos(a) * c.radius * 3, c.y + Math.sin(a) * c.radius * 3, c.radius + 2);
  const kid = createCell(pos.x, pos.y, genome, c);
  kid.energy = kid.maxEnergy * 0.3;
  cells.push(kid);
  stats.births++;
  if (c.children.length > stats.maxKids) { stats.maxKids = c.children.length; stats.maxKidsId = c.id; }
  spawnParticles(kid.x, kid.y, 10, '#fff', 0.9, 38);
  emit('birth', kid, c);
}

// ---------- спавн ----------
function genomeForSpawn() {
  const base = S.spawnGenome;
  if (S.spawnMode === 'exact') return base.slice();
  if (S.spawnSpread >= 255) return randomGenome();
  return base.map(b => clamp(Math.round(b + (Math.random() * 2 - 1) * S.spawnSpread), 0, 255));
}

function spawnCell(x, y, genome) {
  const pos = findFreePos(x, y, S.cellSize + 2);
  const c = createCell(pos.x, pos.y, genome || genomeForSpawn());
  cells.push(c);
  stats.spawned++;
  spawnParticles(c.x, c.y, 6, '#fff', 0.6, 30);
  emit('spawn', c);
  return c;
}

function spawnCellsAt(x, y) {
  const n = S.spawnCount;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = n === 1 ? 0 : Math.sqrt(Math.random()) * S.spawnRadius;
    spawnCell(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
}

let plantAcc = 0;
function spawnPlants(dt) {
  if (plants.length >= S.plantMax) return;
  plantAcc += S.plantRate * dt;
  while (plantAcc >= 1) {
    plantAcc -= 1;
    const pos = findFreePos(20 + Math.random() * (world.w - 40), 20 + Math.random() * (world.h - 40), 5);
    if (pos.ok) plants.push(createPlant(pos.x, pos.y));
  }
}

function spawnFromSources(dt) {
  if (plants.length >= S.plantMax * 1.3) return;
  for (const s of sources) {
    if (!s.alive) continue;
    s.spawnTimer += dt * S.sourceRate;
    while (s.spawnTimer >= 1) {
      s.spawnTimer -= 1;
      const a = Math.random() * Math.PI * 2, r = s.r + 4 + Math.sqrt(Math.random()) * S.sourceRadius;
      const pos = findFreePos(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, 4);
      if (pos.ok) { plants.push(createPlant(pos.x, pos.y, S.sourceFat)); s.spawned++; }
    }
  }
}

function spawnInitial() {
  resetWorldState();
  const cx = world.w / 2, cy = world.h / 2;
  for (let i = 0; i < S.initCells; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * S.initRadius;
    spawnCell(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  stats.spawned = 0;
  for (let i = 0; i < S.initPlants; i++) {
    const pos = findFreePos(20 + Math.random() * (world.w - 40), 20 + Math.random() * (world.h - 40), 5);
    if (pos.ok) plants.push(createPlant(pos.x, pos.y));
  }
  for (let i = 0; i < S.initSources; i++) {
    const pos = findFreePos(40 + Math.random() * (world.w - 80), 40 + Math.random() * (world.h - 80), 30);
    if (pos.ok) sources.push(createSource(pos.x, pos.y));
  }
  obstDirty = true;
  particles.length = 0;
  sampleStats(true);
}

// ==================== STEP ====================
function step(dt) {
  simTime += dt;
  if (obstDirty) rebuildObstacles();
  rebuildGrids();
  spawnPlants(dt);
  spawnFromSources(dt);

  const n = cells.length;
  for (let i = 0; i < n; i++) {
    const c = cells[i];
    if (!c.alive) continue;
    c.thinkTimer -= dt;
    if (c.thinkTimer <= 0) {
      c.thinkTimer = thinkInterval();
      think(c);
      maybeReproduce(c, 0.16);
      if (!c.alive) continue;
    }
    move(c, dt);
    combat(c, dt);
    if (!c.alive) continue;
    economy(c, dt);
    if (c.pulse > 0) c.pulse = Math.max(0, c.pulse - dt * 3);
    if (S.heartbeat && c.alive) {
      c.heartTimer -= dt;
      if (c.heartTimer <= 0) {
        c.heartTimer = 1.5 + Math.random() * 2.5; c.pulse = 1;
        if (Math.random() < 0.3) spawnParticles(c.x, c.y, 1, 'rgba(255,255,255,0.3)', 0.6, 14, 1.5);
      }
    }
  }

  // частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.pow(0.96, dt * 60); p.vx *= f; p.vy *= f;
    p.life -= dt;
    if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); }
  }
  // ошмётки: разлетаются, тормозят и лежат минутами
  for (const m of meats) {
    if (!m.alive) continue;
    m.x += m.vx * dt; m.y += m.vy * dt;
    const f = Math.pow(0.94, dt * 60); m.vx *= f; m.vy *= f;
    m.x = clamp(m.x, m.radius, world.w - m.radius); m.y = clamp(m.y, m.radius, world.h - m.radius);
    m.life -= dt;
    if (m.life <= 0) m.alive = false;
  }

  compact();
  sampleStats(false);
  emit('tick', dt);
}

function compactList(list) {
  let j = 0;
  for (let i = 0; i < list.length; i++) if (list[i].alive) list[j++] = list[i];
  list.length = j;
}
function compact() {
  compactList(cells); compactList(plants); compactList(meats); compactList(sources);
  if (obstDirty === false && sources.length !== _lastSrc) obstDirty = true;
  _lastSrc = sources.length;
  pruneLineage();
}
let _lastSrc = 0;

// Накопитель времени: ускорение/замедление/пауза не влияют на сами механики
let acc = 0;
function advance(frameDt) {
  if (paused) { acc = 0; return; }
  acc += Math.min(frameDt, 0.25) * timeScale;
  const maxSteps = 24;
  let n = 0;
  while (acc >= FIXED_DT && n < maxSteps) { step(FIXED_DT); acc -= FIXED_DT; n++; }
  if (acc >= FIXED_DT) acc = 0;
}
function stepOnce() { step(FIXED_DT); }

// ───────── stats.js ─────────
// ==================== STATISTICS ====================
// История популяции и средних генов, поколения, архетипы и универсальная отрисовка графиков.

const hist = {
  t: [], pop: [], plants: [], meat: [],
  str: [], arm: [], reg: [], cou: [], soc: [], gre: [],
  gen: [], births: [], kills: [], starve: [],
};
let histInterval = 1, lastSample = 0;
const HIST_MAX = 600;

function sampleStats(force) {
  if (force) {
    for (const k in hist) hist[k].length = 0;
    histInterval = 1; lastSample = 0;
  } else if (simTime - lastSample < histInterval) return;
  lastSample = simTime;

  const n = cells.length;
  let s0 = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0, s5 = 0, g = 0;
  for (const c of cells) {
    s0 += c.strength; s1 += c.armor; s2 += c.regen; s3 += c.courage; s4 += c.sociability; s5 += c.greed; g += c.gen;
  }
  const d = n || 1;
  hist.t.push(simTime); hist.pop.push(n); hist.plants.push(plants.length); hist.meat.push(meats.length);
  hist.str.push(s0 / d); hist.arm.push(s1 / d); hist.reg.push(s2 / d);
  hist.cou.push(s3 / d); hist.soc.push(s4 / d); hist.gre.push(s5 / d);
  hist.gen.push(g / d);
  hist.births.push(stats.births); hist.kills.push(stats.kills); hist.starve.push(stats.starve);

  if (hist.t.length > HIST_MAX) {      // прореживаем: вся история остаётся в окне, но реже
    for (const k in hist) hist[k] = hist[k].filter((_, i) => i % 2 === 0);
    histInterval *= 2;
  }
}

// Архетип клетки из cells.jsx: уровень каждой статы 0/1/2
function archetypeIndex(c) {
  const lv = v => (v < 85 ? 0 : v < 170 ? 1 : 2);
  return lv(c.strength) * 9 + lv(c.armor) * 3 + lv(c.regen);
}

function archetypeCounts() {
  const cnt = new Array(27).fill(0);
  for (const c of cells) cnt[archetypeIndex(c)]++;
  return cnt.map((n, i) => ({ name: ARCH_NAMES[i], n })).filter(a => a.n > 0).sort((a, b) => b.n - a.n);
}

function generationSeries() {
  const out = { gens: [], n: [], str: [], arm: [], reg: [], cou: [], soc: [], gre: [] };
  for (let g = 0; g < genAcc.length; g++) {
    const a = genAcc[g];
    out.gens.push(g);
    if (!a || !a.n) { for (const k of ['n', 'str', 'arm', 'reg', 'cou', 'soc', 'gre']) out[k].push(NaN); continue; }
    out.n.push(a.n);
    ['str', 'arm', 'reg', 'cou', 'soc', 'gre'].forEach((k, i) => out[k].push(a.sum[i] / a.n));
  }
  return out;
}

function fmtTime(t) {
  t = Math.floor(t);
  const m = Math.floor(t / 60), s = t % 60;
  return m ? `${m}м ${s}с` : `${s}с`;
}

// ==================== CHARTS ====================
function prepCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300, h = cv.clientHeight || 120;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0a0a0e'; g.fillRect(0, 0, w, h);
  return { g, w, h };
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

// o: { series:[{label,color,data}], x0, x1, xFmt, yMin, yMax }
function drawChart(cv, o) {
  const { g, w, h } = prepCanvas(cv);
  const L = 34, R = 6, T = 16, B = 15;
  let mn = o.yMin, mx = o.yMax;
  if (mx == null) {
    mx = 0;
    for (const s of o.series) for (const v of s.data) if (v > mx) mx = v;
    mx = niceMax(mx);
  }
  if (mn == null) mn = 0;
  if (mx <= mn) mx = mn + 1;
  g.font = '10px sans-serif'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = T + (h - T - B) * (1 - i / 4);
    g.strokeStyle = '#1a1a22'; g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    g.fillStyle = '#667'; g.textAlign = 'right';
    const val = mn + (mx - mn) * i / 4;
    g.fillText(val >= 100 ? Math.round(val) : val.toFixed(val < 10 ? 1 : 0), L - 4, y + 3);
  }
  const xf = o.xFmt || (v => String(Math.round(v)));
  g.fillStyle = '#667'; g.textAlign = 'left'; g.fillText(xf(o.x0), L, h - 3);
  g.textAlign = 'right'; g.fillText(xf(o.x1), w - R, h - 3);

  let lx = L + 2;
  g.textAlign = 'left';
  for (const s of o.series) {
    const n = s.data.length;
    g.strokeStyle = s.color; g.lineWidth = 1.5; g.beginPath();
    let pen = false;
    for (let i = 0; i < n; i++) {
      const v = s.data[i];
      if (!isFinite(v)) { pen = false; continue; }
      const x = L + (n === 1 ? 0.5 : i / (n - 1)) * (w - L - R);
      const y = T + (h - T - B) * (1 - (v - mn) / (mx - mn));
      if (!pen) { g.moveTo(x, y); pen = true; } else g.lineTo(x, y);
    }
    g.stroke();
    g.fillStyle = s.color; g.fillRect(lx, 4, 8, 3);
    g.fillStyle = '#aab'; g.fillText(s.label, lx + 11, 9);
    lx += 16 + g.measureText(s.label).width;
  }
}

// Столбчатая диаграмма для распределений
function drawBars(cv, o) {
  const { g, w, h } = prepCanvas(cv);
  const L = 30, R = 6, T = 16, B = 15;
  let mx = 0;
  for (const s of o.series) for (const v of s.data) if (v > mx) mx = v;
  mx = niceMax(mx);
  g.font = '10px sans-serif';
  const bins = o.labels.length, bw = (w - L - R) / bins, sn = o.series.length;
  for (let i = 0; i <= 2; i++) {
    const y = T + (h - T - B) * (1 - i / 2);
    g.strokeStyle = '#1a1a22'; g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    g.fillStyle = '#667'; g.textAlign = 'right'; g.fillText(Math.round(mx * i / 2), L - 4, y + 3);
  }
  for (let b = 0; b < bins; b++) {
    o.series.forEach((s, k) => {
      const v = s.data[b] || 0, bh = (h - T - B) * v / mx;
      g.fillStyle = s.color;
      g.fillRect(L + b * bw + 2 + k * (bw - 4) / sn, h - B - bh, (bw - 4) / sn - 1, bh);
    });
    g.fillStyle = '#667'; g.textAlign = 'center'; g.fillText(o.labels[b], L + b * bw + bw / 2, h - 3);
  }
  let lx = L + 2; g.textAlign = 'left';
  for (const s of o.series) {
    g.fillStyle = s.color; g.fillRect(lx, 4, 8, 3);
    g.fillStyle = '#aab'; g.fillText(s.label, lx + 11, 9);
    lx += 16 + g.measureText(s.label).width;
  }
}

function histogram(cells_, key, bins) {
  const out = new Array(bins).fill(0);
  for (const c of cells_) out[Math.min(bins - 1, Math.floor(c[key] / 256 * bins))]++;
  return out;
}

// Данные графиков, общие для живой панели и итогового экрана
const SERIES = {
  body: () => [
    { label: 'Сила', color: '#f55', data: hist.str },
    { label: 'Броня', color: '#58f', data: hist.arm },
    { label: 'Реген', color: '#5d5', data: hist.reg }],
  nucleus: () => [
    { label: 'Смелость', color: '#f77', data: hist.cou },
    { label: 'Стайность', color: '#79f', data: hist.soc },
    { label: 'Прожорл.', color: '#7e7', data: hist.gre }],
};

function drawLiveCharts(popCv, bodyCv) {
  const x1 = hist.t.length ? hist.t[hist.t.length - 1] : 0;
  drawChart(popCv, {
    series: [{ label: 'Клетки', color: '#4d9', data: hist.pop }],
    x0: 0, x1, xFmt: fmtTime,
  });
  drawChart(bodyCv, { series: SERIES.body(), yMin: 0, yMax: 255, x0: 0, x1, xFmt: fmtTime });
}

// ───────── render.js ─────────
// ==================== RENDER ====================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let vw = 800, vh = 600, dpr = 1;
const cam = { x: 1000, y: 750, zoom: 1 };

// Состояние ввода, которое нужно рендеру (подсказки инструментов, hover)
const input = { tool: 'spawn', mx: 0, my: 0, over: false, wallDrag: null, hovered: null };

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  vw = canvas.clientWidth; vh = canvas.clientHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
}
window.addEventListener('resize', resizeCanvas);

function screenToWorld(sx, sy) { return [(sx - vw / 2) / cam.zoom + cam.x, (sy - vh / 2) / cam.zoom + cam.y]; }

function fitCamera() {
  cam.zoom = Math.min(vw / world.w, vh / world.h) * 0.96;
  cam.x = world.w / 2; cam.y = world.h / 2;
}

function zoomAt(sx, sy, factor) {
  const [bx, by] = screenToWorld(sx, sy);
  cam.zoom = clamp(cam.zoom * factor, 0.05, 8);
  const [ax, ay] = screenToWorld(sx, sy);
  cam.x += bx - ax; cam.y += by - ay;
}

// ---------- родственники ----------
function getRelatives(c) {
  const anc = [], desc = [];
  let ancTotal = 0, descTotal = 0;
  const rec = lineage.get(c.id);
  if (!rec) return { anc, desc, ancTotal, descTotal };
  let pid = rec.parent, guard = 0;
  while (pid != null && guard++ < 500) {
    const r = lineage.get(pid);
    if (!r) break;
    ancTotal++;
    if (r.cell && r.cell.alive) anc.push(r.cell);
    pid = r.parent;
  }
  const stack = rec.children.slice();
  guard = 0;
  while (stack.length && guard++ < 5000) {
    const r = lineage.get(stack.pop());
    if (!r) continue;
    descTotal++;
    if (r.cell && r.cell.alive) desc.push(r.cell);
    for (const k of r.children) stack.push(k);
  }
  return { anc, desc, ancTotal, descTotal };
}

function pickCell(wx, wy) {
  const reach = 6 / cam.zoom;
  let best = null, bestD = Infinity;
  for (const c of cellGrid.collect(wx, wy, S.cellSize + reach + 4, [])) {
    if (!c.alive) continue;
    const d = Math.hypot(c.x - wx, c.y - wy);
    if (d < c.radius + reach && d < bestD) { bestD = d; best = c; }
  }
  return best;
}

// ---------- главный рендер ----------
function circlePath(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }

function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, vw, vh);

  ctx.save();
  ctx.translate(vw / 2, vh / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  const vx0 = cam.x - vw / 2 / cam.zoom, vx1 = cam.x + vw / 2 / cam.zoom;
  const vy0 = cam.y - vh / 2 / cam.zoom, vy1 = cam.y + vh / 2 / cam.zoom;
  const vis = (x, y, m) => x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m;

  // мир
  ctx.fillStyle = '#030306';
  ctx.fillRect(0, 0, world.w, world.h);
  if (S.worldGrid) {
    ctx.strokeStyle = '#0d0d14'; ctx.lineWidth = 1 / cam.zoom;
    ctx.beginPath();
    for (let x = 0; x <= world.w; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, world.h); }
    for (let y = 0; y <= world.h; y += 100) { ctx.moveTo(0, y); ctx.lineTo(world.w, y); }
    ctx.stroke();
  }
  ctx.strokeStyle = '#24243c'; ctx.lineWidth = 3 / cam.zoom;
  ctx.strokeRect(0, 0, world.w, world.h);

  // растения — тремя пакетами по жирности
  for (let tier = 0; tier < 3; tier++) {
    ctx.fillStyle = tier === 0 ? 'rgba(40,120,50,0.85)' : tier === 1 ? 'rgba(50,165,60,0.9)' : 'rgba(90,215,90,0.95)';
    ctx.beginPath();
    for (const p of plants) {
      if (!p.alive || !vis(p.x, p.y, 10)) continue;
      const t = p.energy < S.plantEnergy * 0.7 ? 0 : p.energy < S.plantEnergy * 1.1 ? 1 : 2;
      if (t === tier) circlePath(p.x, p.y, p.radius);
    }
    ctx.fill();
  }

  // ошмётки
  for (const m of meats) {
    if (!m.alive || !vis(m.x, m.y, 10)) continue;
    const a = Math.min(1, m.life / 12) * 0.92;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${m.r},${m.gb},${m.gb},${a})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,90,70,${a * 0.5})`; ctx.lineWidth = 0.8; ctx.stroke();
  }

  // источники растений
  const pulse = Math.sin(now / 500);
  for (const s of sources) {
    if (!s.alive || !vis(s.x, s.y, s.r * 2.5)) continue;
    const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.2);
    gr.addColorStop(0, 'rgba(255,200,100,0.28)'); gr.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = '#e8b830'; ctx.fill();
    ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.4 + pulse * 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffeeaa'; ctx.fill();
  }

  // палки
  ctx.lineCap = 'round';
  for (const w of walls) {
    if (!vis((w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2, Math.hypot(w.x2 - w.x1, w.y2 - w.y1) / 2 + w.r + 5)) continue;
    ctx.strokeStyle = '#3c3f4a'; ctx.lineWidth = w.r * 2;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.strokeStyle = '#8a8f9c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
  }
  ctx.lineCap = 'butt';

  // частицы
  for (const p of particles) {
    if (!vis(p.x, p.y, 10)) continue;
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.2, p.size * a), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // клетки
  const detail = cam.zoom > 0.3;
  for (const c of cells) {
    if (!c.alive || !vis(c.x, c.y, c.radius + 20)) continue;
    const r = c.radius * (1 + 0.09 * c.pulse);

    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.globalAlpha = 0.9; ctx.fillStyle = c.color; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.8; ctx.stroke();

    // ядро; в танце пульсирует
    const beat = c.task === 'idle' ? 0.5 + 0.5 * Math.sin(c.dancePhase * 1.0) : c.pulse * 0.5;
    const nr = r * (0.3 + 0.16 * beat);
    ctx.beginPath(); ctx.arc(c.x, c.y, nr, 0, Math.PI * 2);
    ctx.globalAlpha = 0.95; ctx.fillStyle = c.nucColor; ctx.fill(); ctx.globalAlpha = 1;
    if (c.task === 'idle') { ctx.strokeStyle = `rgba(255,255,255,${0.1 + 0.25 * beat})`; ctx.lineWidth = 0.6; ctx.stroke(); }

    if (S.hpBars && detail) {
      const bw = r * 2.6, bh = 3, bx = c.x - bw / 2, by = c.y - r - 7;
      const hf = Math.max(0, c.hp / c.maxHp), hard = Math.min(1, c.hardHp / c.maxHp);
      ctx.fillStyle = '#222'; ctx.fillRect(bx, by, bw, bh);
      if (hard > 0) { ctx.fillStyle = '#7a0000'; ctx.fillRect(bx + bw * (1 - hard), by, bw * hard, bh); }
      ctx.fillStyle = hf > 0.6 ? '#3d9' : hf > 0.3 ? '#da4' : '#d33';
      ctx.fillRect(bx, by, bw * hf, bh);
    }

    if (S.combatLines && detail) {
      if (c.task === 'hunt' && c.taskTarget && c.taskTarget.alive) {
        ctx.strokeStyle = 'rgba(255,50,50,0.2)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.taskTarget.x, c.taskTarget.y); ctx.stroke();
      }
      if (c.teammate && c.teammate.alive) {
        ctx.strokeStyle = 'rgba(90,110,255,0.2)'; ctx.lineWidth = 0.6; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.teammate.x, c.teammate.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  drawHoverOverlay(now);
  drawToolPreview();
  ctx.restore();
}

// ---------- подсветка наведённой клетки ----------
function ring(x, y, r, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w / cam.zoom;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}

function drawHoverOverlay(now) {
  const c = input.hovered;
  if (!c || !c.alive) return;
  const rel = getRelatives(c);
  c._rel = rel;

  // родословная: предки — золотые, потомки — бирюзовые
  for (const a of rel.anc) { ring(a.x, a.y, a.radius + 5, 'rgba(255,200,60,0.95)', 2); }
  for (const d of rel.desc) { ring(d.x, d.y, d.radius + 5, 'rgba(60,230,255,0.95)', 2); }
  const rec = lineage.get(c.id);
  if (rec) {
    ctx.lineWidth = 1 / cam.zoom;
    if (rec.parent != null) {
      const pr = lineage.get(rec.parent);
      if (pr && pr.cell && pr.cell.alive) {
        ctx.strokeStyle = 'rgba(255,200,60,0.5)'; ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(pr.cell.x, pr.cell.y); ctx.stroke();
      }
    }
    ctx.strokeStyle = 'rgba(60,230,255,0.4)';
    for (const k of rec.children) {
      const kr = lineage.get(k);
      if (kr && kr.cell && kr.cell.alive) { ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(kr.cell.x, kr.cell.y); ctx.stroke(); }
    }
  }

  ring(c.x, c.y, c.radius + 3, 'rgba(255,255,255,0.9)', 1.5);

  // товарищ
  if (c.teammate && c.teammate.alive) {
    ring(c.teammate.x, c.teammate.y, c.teammate.radius + 5, 'rgba(110,130,255,1)', 2.5);
    ctx.strokeStyle = 'rgba(110,130,255,0.8)'; ctx.lineWidth = 1.5 / cam.zoom; ctx.setLineDash([5 / cam.zoom, 4 / cam.zoom]);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.teammate.x, c.teammate.y); ctx.stroke(); ctx.setLineDash([]);
  }

  // цель и построенный маршрут
  const hasGoal = c.task !== 'idle' && (c.taskTarget || c.task === 'retreat' || c.task === 'explore');
  if (hasGoal) {
    const col = c.task === 'hunt' ? '255,70,70' : c.task === 'retreat' ? '255,170,60' : c.task === 'teamup' ? '110,130,255' : '120,255,120';
    const pts = [c.x, c.y];
    const r = c.route;
    if (r.length) { for (let i = 0; i < r.length; i++) pts.push(r[i]); }
    let endX, endY;
    if (c.task === 'explore') { endX = c.x + Math.cos(c.wanderAngle) * 120; endY = c.y + Math.sin(c.wanderAngle) * 120; pts.length = 2; pts.push(endX, endY); }
    else if (c.taskTarget && c.taskTarget.alive && c.task !== 'retreat') { endX = c.taskTarget.x; endY = c.taskTarget.y; if (pts.length === 2) pts.push(endX, endY); else { pts[pts.length - 2] = endX; pts[pts.length - 1] = endY; } }
    else { endX = pts[pts.length - 2]; endY = pts[pts.length - 1]; if (pts.length === 2) { pts.push(c.fleeX, c.fleeY); endX = c.fleeX; endY = c.fleeY; } }
    ctx.strokeStyle = `rgba(${col},0.9)`; ctx.lineWidth = 2 / cam.zoom;
    ctx.setLineDash([8 / cam.zoom, 5 / cam.zoom]);
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.stroke(); ctx.setLineDash([]);
    for (let i = 2; i < pts.length - 2; i += 2) { ctx.fillStyle = `rgba(${col},0.9)`; ctx.beginPath(); ctx.arc(pts[i], pts[i + 1], 3 / cam.zoom, 0, Math.PI * 2); ctx.fill(); }
    const pr = 8 + 2 * Math.sin(now / 150);
    ring(endX, endY, pr, `rgba(${col},1)`, 2.5);
    const t = c.taskTarget;
    if (t && t.alive && c.task === 'hunt') ring(t.x, t.y, t.radius + 4, 'rgba(255,70,70,1)', 2);
  }
}

function drawToolPreview() {
  if (!input.over) return;
  const [wx, wy] = screenToWorld(input.mx, input.my);
  ctx.lineWidth = 1.5 / cam.zoom;
  const dash = () => ctx.setLineDash([6 / cam.zoom, 5 / cam.zoom]);
  switch (input.tool) {
    case 'spawn':
      ctx.strokeStyle = 'rgba(120,255,160,0.8)';
      if (S.spawnCount > 1 && S.spawnRadius > 0) { dash(); ctx.beginPath(); ctx.arc(wx, wy, S.spawnRadius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      ctx.beginPath(); ctx.arc(wx, wy, S.cellSize, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'plant':
      ctx.strokeStyle = 'rgba(100,255,100,0.7)'; dash(); ctx.beginPath(); ctx.arc(wx, wy, 25, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      break;
    case 'source':
      ctx.strokeStyle = 'rgba(255,200,80,0.8)'; dash();
      ctx.beginPath(); ctx.arc(wx, wy, 18 + S.sourceRadius + 4, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(wx, wy, 18, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'wall':
      ctx.lineCap = 'round';
      if (input.wallDrag) {
        ctx.strokeStyle = 'rgba(180,185,200,0.7)'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(input.wallDrag.x, input.wallDrag.y); ctx.lineTo(wx, wy); ctx.stroke();
      } else { ctx.strokeStyle = 'rgba(180,185,200,0.7)'; ctx.beginPath(); ctx.arc(wx, wy, 6, 0, Math.PI * 2); ctx.stroke(); }
      ctx.lineCap = 'butt';
      break;
    case 'erase':
      ctx.strokeStyle = 'rgba(255,80,80,0.8)'; ctx.beginPath(); ctx.arc(wx, wy, 35, 0, Math.PI * 2); ctx.stroke();
      break;
  }
}

// ==================== HOVER PANEL ====================
const hoverPanel = document.getElementById('hoverPanel');
const TASK_NAMES = {
  idle: '💃 Танцует', forage: '🌿 Сбор растений', forage_meat: '🥩 Сбор мяса', explore: '🧭 Поиск еды',
  hunt: '🎯 Охота', retreat: '🏃 Отступление', teamup: '🤝 Держится товарища',
};
let lastPanelUpdate = 0;

function updateHoverPanel(now) {
  const c = input.hovered;
  if (!c || !c.alive) { hoverPanel.style.display = 'none'; return; }
  if (now - lastPanelUpdate > 90) { lastPanelUpdate = now; hoverPanel.innerHTML = hoverHtml(c); }
  hoverPanel.style.display = 'block';
  // не вылезает за экран: меняет сторону от курсора у границ
  const pw = hoverPanel.offsetWidth, ph = hoverPanel.offsetHeight;
  const top = canvas.getBoundingClientRect().top;
  let px = input.mx + 18, py = input.my + 18 + top;
  if (px + pw > window.innerWidth - 4) px = input.mx - pw - 18;
  if (py + ph > window.innerHeight - 4) py = input.my + top - ph - 18;
  hoverPanel.style.left = Math.max(4, px) + 'px';
  hoverPanel.style.top = Math.max(top + 2, py) + 'px';
}

function hoverHtml(c) {
  const def = c.armor / 255, pen = c.strength / 255;
  const crit = S.critChance * (1 + pen) * (1 - def * 0.7) * 100;
  const upkeep = c.baseUpkeep * S.hungerMult;
  const tEmpty = upkeep > 0 ? c.energy / upkeep : Infinity;
  const tDeath = S.starveDmg > 0 ? tEmpty + c.hp / S.starveDmg : Infinity;
  const hf = c.hp / c.maxHp, hardPct = c.hardHp / c.maxHp * 100;
  const hpCol = hf > 0.6 ? '#3d9' : hf > 0.3 ? '#da4' : '#d33';
  const t = c.taskTarget;
  const rel = c._rel || getRelatives(c);
  const retreatThr = lerp(0.5, 0.1, c.courage / 255) * (1 - 0.35 * c.regen / 255) * 100;
  const hungerThr = (0.3 + c.greed / 255 * 0.45) * 100;
  const f = v => (isFinite(v) ? v.toFixed(1) + 'с' : '∞');
  const row = (a, b) => `<div class="stat-row"><span>${a}</span><span>${b}</span></div>`;
  const gcol = ['rgb(%,0,0)', 'rgb(0,0,%)', 'rgb(0,%,0)', 'rgb(%,0,0)', 'rgb(0,0,%)', 'rgb(0,%,0)'];
  const genome = c.genome.map((b, i) =>
    `<div title="${GENE_NAMES[i]}: ${b}" style="background:${gcol[i].replace('%', b)};opacity:${i > 2 ? 0.75 : 1}"><i>${b}</i></div>`).join('');

  return `
    <div class="section-title">Клетка #${c.id}${c.parent ? ` · от #${c.parent}` : ' · заспавнена'} · поколение ${c.gen}</div>
    <div class="genome-bar">${genome}</div>
    ${row('❤️ HP', `${c.hp.toFixed(1)} / ${c.maxHp.toFixed(0)}`)}
    <div class="hp-bar"><div class="hp-fill" style="width:${(hf * 100).toFixed(1)}%;background:${hpCol}"></div>${c.hardHp > 0 ? `<div class="hard-zone" style="width:${hardPct.toFixed(1)}%"></div>` : ''}</div>
    ${c.hardHp > 0 ? row('<span style="color:#d44">🩸 Хард-урон</span>', `${hardPct.toFixed(0)}% · лечение ×${S.hardHealCost}`) : ''}
    ${row('⚡ Энергия', `${c.energy.toFixed(1)} / ${c.maxEnergy.toFixed(0)}`)}
    <div class="hp-bar"><div class="hp-fill" style="width:${(c.energy / c.maxEnergy * 100).toFixed(1)}%;background:#cb4"></div></div>
    ${row('💀 До 0 энергии / смерти', `${f(tEmpty)} / ${f(tDeath)}`)}
    <div class="section-title">Тело</div>
    ${row('🔴 Сила ' + c.strength, `урон ${(c.attackDamage * S.dmgMult).toFixed(1)} · КД ${c.attackCooldown.toFixed(2)}с ${c.attackTimer > 0 ? '⏳' : '✅'}`)}
    ${row('шанс крита', `${crit.toFixed(1)}%`)}
    ${row('откидывание', (c.knockback * S.knockMult / c.mass).toFixed(0))}
    ${row('🔵 Броня ' + c.armor, `−${(def * 50).toFixed(0)}% урона · масса ${c.mass.toFixed(2)}`)}
    ${row('скорость', (c.speed * S.speedMult).toFixed(0))}
    ${row('🟢 Реген ' + c.regen, `${c.regenRate.toFixed(1)} HP/с · расход ${upkeep.toFixed(2)}/с`)}
    ${row('в покое после боя', `через ${(0.5 + 4.5 * (1 - c.regen / 255) + 2).toFixed(1)}с`)}
    <div class="section-title">Ядро</div>
    ${row('🔴 Смелость ' + c.courage, `отступит при HP < ${retreatThr.toFixed(0)}%`)}
    ${row('🔵 Стайность ' + c.sociability, `${c.sociability > 90 ? 'ищет товарища' : 'одиночка'}`)}
    ${row('🟢 Прожорл. ' + c.greed, `ест при энергии < ${hungerThr.toFixed(0)}%`)}
    <div class="section-title">Поведение</div>
    ${row('Задача', TASK_NAMES[c.task] || c.task)}
    ${t && t.alive && t.id ? row('Цель', '#' + t.id) : ''}
    ${c.teammate && c.teammate.alive ? row('🤝 Товарищ', '#' + c.teammate.id) : ''}
    ${row('Возраст · убийств', `${fmtTime(c.age)} · ${c.kills}`)}
    <div class="section-title">Род</div>
    ${row('<span style="color:#fc3">● Предки</span>', `${rel.ancTotal} (живых ${rel.anc.length})`)}
    ${row('<span style="color:#3ef">● Потомки</span>', `${rel.descTotal} (живых ${rel.desc.length}) · детей ${c.children.length}`)}
  `;
}
