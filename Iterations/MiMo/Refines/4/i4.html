<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Клетки 4</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; color: #ccc; }
canvas { display: block; cursor: crosshair; }

/* Top bar */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 36px;
  background: rgba(20,20,20,0.92); display: flex; align-items: center;
  padding: 0 12px; gap: 8px; z-index: 100; border-bottom: 1px solid #333;
  font-size: 13px;
}
#topbar button, #topbar select, #topbar input[type=range] {
  background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 4px;
  padding: 3px 8px; cursor: pointer; font-size: 12px;
}
#topbar button:hover { background: #3a3a3a; }
#topbar button.active { background: #444; border-color: #888; }
#topbar label { display: flex; align-items: center; gap: 4px; }
.sep { width: 1px; height: 20px; background: #444; margin: 0 4px; }
#stats { margin-left: auto; font-size: 12px; opacity: 0.7; }

/* Hover panel */
#hoverPanel {
  position: fixed; pointer-events: none; background: rgba(15,15,20,0.93);
  border: 1px solid #555; border-radius: 6px; padding: 10px 12px;
  font-size: 12px; line-height: 1.5; min-width: 200px; max-width: 280px;
  display: none; z-index: 200; backdrop-filter: blur(4px);
}
#hoverPanel .hp-bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 3px 0; }
#hoverPanel .hp-fill { height: 100%; border-radius: 3px; transition: width 0.1s; }
#hoverPanel .hard-zone { height: 100%; background: #8b0000; position: absolute; right: 0; top: 0; }
#hoverPanel .stat-row { display: flex; justify-content: space-between; }
#hoverPanel .section-title { color: #aaa; font-weight: bold; margin-top: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
.genome-bar { display: flex; gap: 2px; margin: 4px 0; }
.genome-bar div { width: 20px; height: 10px; border-radius: 2px; border: 1px solid #555; }

/* Settings panel */
#settingsPanel {
  position: fixed; top: 44px; right: 8px; background: rgba(15,15,20,0.95);
  border: 1px solid #444; border-radius: 8px; padding: 14px; z-index: 150;
  width: 320px; max-height: 80vh; overflow-y: auto; display: none;
  font-size: 12px;
}
#settingsPanel h3 { margin-bottom: 8px; color: #ddd; font-size: 14px; }
#settingsPanel .setting-group { margin-bottom: 10px; }
#settingsPanel .setting-group label { display: flex; justify-content: space-between; margin: 3px 0; }
#settingsPanel input[type=range] { width: 120px; }
#settingsPanel input[type=number] { width: 60px; background: #222; border: 1px solid #444; color: #ccc; border-radius: 3px; padding: 2px 4px; }

/* Stats panel */
#statsPanel {
  position: fixed; top: 44px; left: 8px; background: rgba(15,15,20,0.95);
  border: 1px solid #444; border-radius: 8px; padding: 14px; z-index: 150;
  width: 320px; max-height: 80vh; overflow-y: auto; display: none;
  font-size: 12px;
}
#statsPanel canvas { width: 100%; height: 100px; margin: 6px 0; }

/* Tool indicator */
#toolIndicator {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,20,0.9); padding: 4px 14px; border-radius: 12px;
  font-size: 12px; z-index: 100; border: 1px solid #444;
}
</style>
</head>
<body>

<div id="topbar">
  <button id="btnPlay" class="active" title="Play/Pause">▶</button>
  <button id="btnPause" title="Pause">⏸</button>
  <div class="sep"></div>

</div>

<div id="toolIndicator">Tool: Spawn Cell (click to place)</div>

<canvas id="canvas"></canvas>

<div id="hoverPanel"></div>

<div id="settingsPanel">
  <h3>⚙ Настройки</h3>
  <div class="setting-group">
    <h4>Спавн клеток</h4>

    <label>Энергия растений: <input type="range" id="setPlantEnergy" min="5" max="100" value="30"> <span id="plantEnergyVal">30</span></label>

  <div class="setting-group">
    <h4>Источники еды</h4>

    <label>Скорость спавна: <input type="range" id="setSourceRate" min="0" max="5" step="0.1" value="1"> <span id="sourceRateVal">1</span>/с</label>
    <label>Радиус спавна: <input type="range" id="setSourceRadius" min="20" max="150" value="60"> <span id="sourceRadVal">60</span></label>

</div>

<div id="statsPanel">
  <h3>📊 Статистика</h3>
  <div id="statsContent">
    <div>Клеток: <span id="statCells">0</span></div>
    <div>Растений: <span id="statPlants">0</span></div>
    <div>Источников: <span id="statSources">0</span></div>
    <div>Убийств: <span id="statKills">0</span></div>
    <div>Рождений: <span id="statBirths">0</span></div>
    <div>Смертей от голода: <span id="statStarve">0</span></div>
    <div class="section-title">Динамика популяции</div>
    <canvas id="popChart" width="300" height="100"></canvas>
    <div class="section-title">Средние характеристики</div>
    <canvas id="statChart" width="300" height="100"></canvas>
  </div>
</div>

<script>
// ==================== ENGINE v3 ====================
// Iteration 3: Food Sources, Wall-Safe Spawning, Rebalance (Blue/Green buff)

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight - 36;
  canvas.style.marginTop = '36px';
}
resize();
window.addEventListener('resize', resize);

// Camera
let cam = { x: 0, y: 0, zoom: 1 };
let targetZoom = 1;

// World settings
let worldW = 2000, worldH = 1500;
let settings = {
  cellBaseSize: 12,
  plantSpawnRate: 2,
  plantEnergy: 30,
  dmgMult: 1,
  critChanceBase: 0.15,
  hardDmgEnabled: true,
  initCells: 30,
  spawnRadius: 200,
  randomSpawn: true,
  // Food source settings
  initSources: 5,
  sourceSpawnRate: 1,
  sourceSpawnRadius: 60
};

// Game state
let cells = [];
let plants = [];
let meats = [];      // Meat drops from dead cells
let particles = [];
let walls = [];
let foodSources = []; // NEW: Food source objects
let paused = false;
let timeScale = 1;
let nextId = 1;
let stats = { kills: 0, births: 0, starve: 0 };
let popHistory = [];
let avgHistory = [];

let currentTool = 'spawn';

// ==================== SPATIAL GRID ====================
const GRID_SIZE = 200; // sight range bucket
const spatialGrid = new Map();

function buildSpatialGrid() {
  spatialGrid.clear();
  for (const c of cells) {
    if (!c.alive) continue;
    const gx = Math.floor(c.x / GRID_SIZE);
    const gy = Math.floor(c.y / GRID_SIZE);
    const key = (gx << 16) | (gy & 0xFFFF);
    let bucket = spatialGrid.get(key);
    if (!bucket) { bucket = []; spatialGrid.set(key, bucket); }
    bucket.push(c);
  }
}

function getNearbyCells(x, y, range) {
  const result = [];
  const r = Math.ceil(range / GRID_SIZE);
  const cx = Math.floor(x / GRID_SIZE);
  const cy = Math.floor(y / GRID_SIZE);
  for (let dx = -r; dx <= r; dx++) {
    for (let dy = -r; dy <= r; dy++) {
      const key = ((cx + dx) << 16) | ((cy + dy) & 0xFFFF);
      const b = spatialGrid.get(key);
      if (b) for (const c of b) result.push(c);
    }
  }
  return result;
}

// ==================== GENOME & COLOR ====================
// GENOME LAYOUT: [R_body=strength, G_body=armor, B_body=regen, R_nuc=courage, G_nuc=sociability, B_nuc=greed]
// COLOR RULE: Red=Strength, Blue=Armor, Green=Regen  → rgb(strength, regen, armor)
function createGenome(random = true) {
  if (!random) return [128, 128, 128, 128, 128, 128];
  return Array.from({ length: 6 }, () => Math.floor(Math.random() * 256));
}

// FIX: swap green and blue channels — red=strength(g[0]), green=regen(g[2]), blue=armor(g[1])
function genomeColor(g) {
  return `rgb(${g[0]},${g[2]},${g[1]})`;
}
function nucleusColor(g) {
  // courage=R(g[3]), greed=G(g[5]), sociability=B(g[4])
  return `rgb(${g[3]},${g[5]},${g[4]})`;
}

// ==================== CELL ====================
function createCell(x, y, genome, parent) {
  const g = genome || createGenome(true);
  const strength    = g[0]; // red body
  const armor       = g[1]; // blue body (thick membrane)
  const regen       = g[2]; // green body (healing speed)
  const courage     = g[3]; // red nucleus  (aggression)
  const sociability = g[4]; // blue nucleus (pack)
  const greed       = g[5]; // green nucleus (hunger threshold)

  // REBALANCE v4: Further buff regen (green) and armor (blue)
  const mass = 1 + armor / 255 * 1.2; // Even less mass penalty
  const maxHp = 110 + armor * 1.0; // More HP from armor
  const maxEnergy = 150 + strength * 0.5; // More base energy
  const speed = (320 - armor * 0.3) / mass; // Less speed penalty, higher base
  const attackCooldown = 0.2 + (strength / 255) * 1.2; // Faster attacks
  const attackDamage = 7 + (strength / 255) * 45; // Slightly more damage for all
  const knockbackForce = 70 + strength * 0.2; // More knockback
  const regenRate = regen / 255 * 28; // SIGNIFICANTLY better regen (was *18)
  // High regen = much less energy consumption
  const energyConsumption = 1.5 + regen / 255 * 2 + (regen > 150 ? 1 : 0); // Much lower consumption

  return {
    id: nextId++,
    x, y,
    vx: 0, vy: 0,
    radius: settings.cellBaseSize,
    genome: [...g],
    strength, armor, regen,
    courage, sociability, greed,
    mass,
    hp: maxHp, maxHp,
    energy: maxEnergy * 0.8, maxEnergy,
    speed,
    attackDamage,
    attackCooldown,
    attackTimer: 0,
    knockbackForce,
    regenRate,
    energyConsumption,
    regenCombatNerf: 0,
    alive: true,
    age: 0,
    parent: parent || null,
    children: [],
    target: null,
    teammate: null,
    task: 'idle',
    taskTarget: null,
    wanderAngle: Math.random() * Math.PI * 2,
    wanderTimer: 0,
    heartbeatTimer: Math.random() * 3,
    hardHp: 0,       // unrecoverable damage zone (heals at 10x energy cost)
    meatEaten: 0,    // track meat vs plant ratio
    plantEaten: 0,
    attackedBy: null, // who hit us last frame
  };
}

// ==================== PLANT ====================
function createPlant(x, y, energyOverride) {
  return {
    x, y,
    radius: 4 + Math.random() * 3,
    energy: energyOverride !== undefined ? energyOverride : settings.plantEnergy * (0.5 + Math.random() * 0.5),
    alive: true,
  };
}

// ==================== FOOD SOURCE ====================
// NEW: Food sources that continuously spawn plants around them
function createFoodSource(x, y) {
  return {
    id: nextId++,
    x, y,
    radius: 18,
    spawnTimer: Math.random() * 2,
    alive: true,
    plantsSpawned: 0,
  };
}

// ==================== MEAT DROPS ====================
// Meat is the loot from dead cells — energy and count scale with their energy level
function spawnMeatDrops(cell) {
  const energyRatio = Math.max(0, cell.energy / cell.maxEnergy); // 0..1
  const count = Math.floor(3 + energyRatio * 14); // 3..17 chunks
  const totalEnergy = cell.energy * 1.0; // all energy goes into meat

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 30 + Math.random() * 100;
    const chunkEnergy = (totalEnergy / count) * (0.4 + Math.random() * 1.2);
    const life = 60 + energyRatio * 80 + Math.random() * 30; // 60-170s

    meats.push({
      x: cell.x + Math.cos(angle) * (cell.radius + 2),
      y: cell.y + Math.sin(angle) * (cell.radius + 2),
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      radius: 2.5 + energyRatio * 3,
      energy: Math.max(4, chunkEnergy),
      life,
      maxLife: life,
      alive: true,
      // Color: reddish meat, tinted by cell's original color
      r: 180 + Math.floor(cell.genome[0] * 0.3),
      gb: 30 + Math.floor(cell.genome[2] * 0.2),
    });
  }
}

// ==================== PARTICLES ====================
function spawnParticles(x, y, count, color, life, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      color,
      size: 1 + Math.random() * 2,
    });
  }
}

function spawnDeathParticles(cell) {
  // Visual explosion
  spawnParticles(cell.x, cell.y, 20, genomeColor(cell.genome), 1.5, 90);
  spawnParticles(cell.x, cell.y, 8, '#fff', 0.4, 50);
  // Meat drops (food loot)
  spawnMeatDrops(cell);
}

// ==================== UTILITY ====================
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function findNearest(cell, list, maxDist) {
  let best = null, bestD = maxDist;
  for (const t of list) {
    if (t === cell || !t.alive) continue;
    const d = dist(cell, t);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}

function genomeSimilarity(a, b) {
  let diff = 0;
  for (let i = 0; i < 6; i++) diff += Math.abs(a[i] - b[i]);
  return 1 - diff / (255 * 6);
}

// ==================== WALL COLLISION CHECK ====================
// NEW: Check if a point is inside any wall or food source
function isPointInWall(x, y, margin = 0) {
  for (const w of walls) {
    const d = Math.hypot(x - w.x, y - w.y);
    if (d < w.radius + margin) return true;
  }
  // Also check food sources (they now have collision)
  for (const s of foodSources) {
    if (!s.alive) continue;
    const d = Math.hypot(x - s.x, y - s.y);
    if (d < s.radius + margin) return true;
  }
  return false;
}

// NEW: Find nearest valid position outside walls and food sources
function findValidPositionNear(x, y, margin = 0, maxAttempts = 50) {
  // First check if the point itself is valid
  if (!isPointInWall(x, y, margin) && 
      x >= margin && x <= worldW - margin && 
      y >= margin && y <= worldH - margin) {
    return { x, y, valid: true };
  }
  
  // Try to find a valid position nearby using spiral search
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const angle = attempt * 0.5;
    const distance = 5 + attempt * 2;
    const nx = x + Math.cos(angle) * distance;
    const ny = y + Math.sin(angle) * distance;
    
    if (!isPointInWall(nx, ny, margin) && 
        nx >= margin && nx <= worldW - margin && 
        ny >= margin && ny <= worldH - margin) {
      return { x: nx, y: ny, valid: true };
    }
  }
  
  // Fallback: return original position (may still be invalid)
  return { x, y, valid: false };
}

// ==================== WALL STEERING ====================
// Returns a steering direction vector (normalized) that avoids walls and food sources
function wallSteerDir(cell, tx, ty) {
  const dx = tx - cell.x, dy = ty - cell.y;
  const d = Math.hypot(dx, dy) || 1;
  let fx = dx / d, fy = dy / d;

  if (walls.length === 0 && foodSources.length === 0) return [fx, fy];

  let repX = 0, repY = 0;
  // TASK 2: Reduced avoid radius for walls - cells will approach closer before avoiding
  const avoidRadius = cell.radius + 15; // Was 40, now 15 - much closer approach

  for (const w of walls) {
    const wdx = cell.x - w.x, wdy = cell.y - w.y;
    const wd = Math.hypot(wdx, wdy);
    const minD = cell.radius + w.radius + avoidRadius;

    if (wd < minD && wd > 0.1) {
      const strength = (1 - wd / minD) * 3.0;
      repX += (wdx / wd) * strength;
      repY += (wdy / wd) * strength;
    }

    // Also: if wall lies on the path ahead, push perpendicular
    const proj = (w.x - cell.x) * fx + (w.y - cell.y) * fy;
    if (proj > 0 && proj < 180) {
      const perpX = (w.x - cell.x) - fx * proj;
      const perpY = (w.y - cell.y) - fy * proj;
      const perpD = Math.hypot(perpX, perpY);
      const wallClearance = cell.radius + w.radius + 10; // Reduced clearance
      if (perpD < wallClearance && perpD > 0.1) {
        const str = (1 - perpD / wallClearance) * 2.5;
        repX -= (perpX / perpD) * str;
        repY -= (perpY / perpD) * str;
      }
    }
  }
  
  // Also avoid food sources (they now have collision)
  for (const s of foodSources) {
    if (!s.alive) continue;
    const sdx = cell.x - s.x, sdy = cell.y - s.y;
    const sd = Math.hypot(sdx, sdy);
    const minSD = cell.radius + s.radius + avoidRadius;
    
    if (sd < minSD && sd > 0.1) {
      const strength = (1 - sd / minSD) * 3.0;
      repX += (sdx / sd) * strength;
      repY += (sdy / sd) * strength;
    }
  }

  // World border avoidance
  const borderMargin = 30;
  if (cell.x < borderMargin)      repX += (1 - cell.x / borderMargin) * 2;
  if (cell.x > worldW - borderMargin) repX -= (1 - (worldW - cell.x) / borderMargin) * 2;
  if (cell.y < borderMargin)      repY += (1 - cell.y / borderMargin) * 2;
  if (cell.y > worldH - borderMargin) repY -= (1 - (worldH - cell.y) / borderMargin) * 2;

  fx += repX;
  fy += repY;
  const fl = Math.hypot(fx, fy) || 1;
  return [fx / fl, fy / fl];
}

// ==================== REPRODUCTION ====================
function reproduce(cell) {
  if (cell.energy < cell.maxEnergy * 0.6) return;
  cell.energy -= cell.maxEnergy * 0.6;

  const condition = (cell.hp / cell.maxHp + cell.energy / cell.maxEnergy) / 2;
  const mutStrength = Math.floor((1 - condition) * 35 + 3);

  const childGenome = cell.genome.map(b => {
    const mut = Math.floor((Math.random() - 0.5) * 2 * mutStrength);
    return Math.max(0, Math.min(255, b + mut));
  });

  const angle = Math.random() * Math.PI * 2;
  const child = createCell(
    cell.x + Math.cos(angle) * cell.radius * 3,
    cell.y + Math.sin(angle) * cell.radius * 3,
    childGenome, cell.id
  );
  child.energy = child.maxEnergy * 0.3;
  cell.children.push(child.id);
  cells.push(child);
  stats.births++;
  spawnParticles(child.x, child.y, 10, '#fff', 0.9, 35);
}

// ==================== AI ====================

// Helper: Check if a target position is reachable (not blocked by walls, food sources, or borders)
function isPositionReachable(cell, tx, ty) {
  const borderMargin = cell.radius + 5;
  // Check world bounds
  if (tx < borderMargin || tx > worldW - borderMargin || ty < borderMargin || ty > worldH - borderMargin) {
    return false;
  }
  // Check wall collisions along the path
  for (const w of walls) {
    const minD = cell.radius + w.radius + 10;
    if (Math.hypot(tx - w.x, ty - w.y) < minD) {
      return false;
    }
  }
  // Also check food sources (they now have collision)
  for (const s of foodSources) {
    if (!s.alive) continue;
    const minD = cell.radius + s.radius + 10;
    if (Math.hypot(tx - s.x, ty - s.y) < minD) {
      return false;
    }
  }
  return true;
}

function updateAI(cell, dt) {
  const sightRange = 300;
  const nearbyCells = getNearbyCells(cell.x, cell.y, sightRange)
    .filter(c => c !== cell && c.alive && dist(cell, c) < sightRange);

  // Find nearby food (plants, meat, and food sources)
  const nearbyPlants = plants.filter(p => p.alive && dist(cell, p) < sightRange);
  const nearbyMeats  = meats.filter(m => m.alive && dist(cell, m) < sightRange);
  const nearbySources = foodSources.filter(s => s.alive && dist(cell, s) < sightRange);

  if (cell.regenCombatNerf > 0) cell.regenCombatNerf -= dt;

  const isHungry        = cell.energy < cell.maxEnergy * 0.55;
  const isVeryHungry    = cell.energy < cell.maxEnergy * 0.25;
  const isCriticallyDamaged = cell.hp < cell.maxHp * 0.2;

  // ── REPRODUCTION CHECK (outside priority waterfall so it isn't blocked) ──
  // Only when well-fed and healthy
  if (!isHungry && cell.hp > cell.maxHp * 0.55 && cell.hardHp < cell.maxHp * 0.3) {
    // greed lowers reproduction willingness
    const reproChance = (0.004 + (1 - cell.greed / 255) * 0.012) * dt;
    if (Math.random() < reproChance) {
      reproduce(cell);
    }
  }

  // ── Priority 1: Retreat ──
  if (isCriticallyDamaged && cell.courage < 180) {
    cell.task = 'retreat';
    // flee from nearest attacker or just any nearby cell
    const threat = nearbyCells.find(c => c.target === cell || c.taskTarget === cell)
                || nearbyCells[0];
    cell.taskTarget = threat || null;
    return;
  }

  // ── Priority 2: Retaliate if attacked ──
  if (cell.attackedBy && cell.attackedBy.alive) {
    cell.task = 'hunt';
    cell.taskTarget = cell.attackedBy;
    cell.attackedBy = null;
    return;
  }

  // ── Priority 3: Hunt (courageous cells) ──
  if (cell.courage > 80 && (isHungry || cell.greed < 100)) {
    const prey = findNearest(cell, nearbyCells, sightRange);
    if (prey && cell.strength > prey.armor * 0.5) {
      cell.task = 'hunt';
      cell.taskTarget = prey;
      return;
    }
  }

  // ── Priority 4: Eat food ──
  if (isHungry || cell.greed < 150) {
    // Prefer meat if courageous (bloodthirsty regen cells need meat anyway)
    const wantsMeat = cell.courage > 100 || cell.regen > 150;
    let foodTarget = null;

    if (wantsMeat && nearbyMeats.length > 0) {
      foodTarget = findNearest(cell, nearbyMeats, sightRange);
      // Check if food is reachable before targeting
      if (foodTarget && isPositionReachable(cell, foodTarget.x, foodTarget.y)) {
        cell.task = 'forage_meat';
        cell.taskTarget = foodTarget;
        return;
      } else if (foodTarget) {
        // Unreachable food - cancel task and don't try again immediately
        cell.task = 'idle';
        cell.taskTarget = null;
      }
    }
    if (nearbyPlants.length > 0) {
      foodTarget = findNearest(cell, nearbyPlants, sightRange);
      // Check if food is reachable before targeting
      if (foodTarget && isPositionReachable(cell, foodTarget.x, foodTarget.y)) {
        cell.task = 'forage';
        cell.taskTarget = foodTarget;
        return;
      } else if (foodTarget) {
        // Unreachable food - cancel task and don't try again immediately
        cell.task = 'idle';
        cell.taskTarget = null;
      }
    }
    if (nearbyMeats.length > 0) {
      foodTarget = findNearest(cell, nearbyMeats, sightRange);
      // Check if food is reachable before targeting
      if (foodTarget && isPositionReachable(cell, foodTarget.x, foodTarget.y)) {
        cell.task = 'forage_meat';
        cell.taskTarget = foodTarget;
        return;
      } else if (foodTarget) {
        // Unreachable food - cancel task and don't try again immediately
        cell.task = 'idle';
        cell.taskTarget = null;
      }
    }
    // NEW: Target food sources if no other food available
    if (nearbySources.length > 0 && !foodTarget) {
      foodTarget = findNearest(cell, nearbySources, sightRange);
      if (foodTarget && isPositionReachable(cell, foodTarget.x, foodTarget.y)) {
        cell.task = 'forage_source';
        cell.taskTarget = foodTarget;
        return;
      }
    }
    if (isVeryHungry) {
      const prey = findNearest(cell, nearbyCells, sightRange);
      // Check if prey is reachable before targeting
      if (prey && isPositionReachable(cell, prey.x, prey.y)) {
        cell.task = 'hunt';
        cell.taskTarget = prey;
        return;
      }
    }
  }

  // ── Priority 5: Team up ──
  if (cell.sociability > 100 && !cell.teammate) {
    const friend = nearbyCells.find(c => {
      if (!c.alive || c === cell) return false;
      const sim = genomeSimilarity(cell.genome, c.genome);
      return c.target !== cell && sim > 0.45 &&
             (cell.sociability / 255) * (c.sociability / 255) > 0.15;
    });
    if (friend) { cell.teammate = friend; cell.task = 'teamup'; cell.taskTarget = friend; return; }
  }

  // ── Priority 6: Follow teammate ──
  if (cell.teammate) {
    if (!cell.teammate.alive) { cell.teammate = null; }
    else {
      cell.task = 'teamup';
      cell.taskTarget = cell.teammate;
      if (cell.teammate.task === 'hunt' && cell.teammate.taskTarget && Math.random() < cell.sociability / 255) {
        cell.task = 'hunt';
        cell.taskTarget = cell.teammate.taskTarget;
      }
      return;
    }
  }

  // ── Default: idle / dance ──
  cell.task = 'idle';
  cell.taskTarget = null;
}

// ==================== MOVEMENT ====================
function updateMovement(cell, dt) {
  if (!cell.alive) return;

  let dirX = 0, dirY = 0;
  let moving = false;
  let slowMode = false; // for approaching food/teammate (not full sprint)

  switch (cell.task) {
    case 'hunt':
      if (cell.taskTarget && cell.taskTarget.alive) {
        const [dx, dy] = wallSteerDir(cell, cell.taskTarget.x, cell.taskTarget.y);
        dirX = dx; dirY = dy; moving = true;
        cell.target = cell.taskTarget;
      }
      break;

    case 'forage':
    case 'forage_meat':
    case 'forage_source': // NEW: Move towards food source
      if (cell.taskTarget && cell.taskTarget.alive) {
        const [dx, dy] = wallSteerDir(cell, cell.taskTarget.x, cell.taskTarget.y);
        dirX = dx; dirY = dy; moving = true;
        slowMode = true;
      }
      break;

    case 'retreat': {
      let rx = 0, ry = 0;
      if (cell.taskTarget && cell.taskTarget.alive) {
        const dx = cell.x - cell.taskTarget.x, dy = cell.y - cell.taskTarget.y;
        const d = Math.hypot(dx, dy) || 1;
        rx = dx / d; ry = dy / d;
      }
      // Also run from all nearby threats
      const nearby = getNearbyCells(cell.x, cell.y, 120);
      for (const c of nearby) {
        if (c === cell) continue;
        const d = dist(cell, c);
        if (d < 120 && d > 0) {
          const dx = cell.x - c.x, dy = cell.y - c.y;
          rx += (dx / d) * (1 - d / 120) * 0.5;
          ry += (dy / d) * (1 - d / 120) * 0.5;
        }
      }
      const rl = Math.hypot(rx, ry) || 1;
      const tx = cell.x + (rx / rl) * 200, ty = cell.y + (ry / rl) * 200;
      const [dx, dy] = wallSteerDir(cell, tx, ty);
      dirX = dx; dirY = dy; moving = true;
      break;
    }

    case 'teamup':
      if (cell.taskTarget && cell.taskTarget.alive) {
        const d = dist(cell, cell.taskTarget);
        if (d > 50) {
          const [dx, dy] = wallSteerDir(cell, cell.taskTarget.x, cell.taskTarget.y);
          dirX = dx; dirY = dy; moving = true; slowMode = true;
        }
      }
      break;

    case 'idle':
    default:
      // Dance: change wander angle periodically
      cell.wanderTimer -= dt;
      if (cell.wanderTimer <= 0) {
        cell.wanderAngle += (Math.random() - 0.5) * 2.0;
        cell.wanderTimer = 0.4 + Math.random() * 1.2;
      }
      const wx = cell.x + Math.cos(cell.wanderAngle) * 80;
      const wy = cell.y + Math.sin(cell.wanderAngle) * 80;
      const [wdx, wdy] = wallSteerDir(cell, wx, wy);
      dirX = wdx; dirY = wdy; moving = true;
      slowMode = true;
      break;
  }

  if (moving) {
    const accel = cell.speed * (slowMode ? 2 : 4);
    cell.vx += dirX * accel * dt;
    cell.vy += dirY * accel * dt;
  }

  // Speed cap
  const spd = Math.hypot(cell.vx, cell.vy);
  const maxSpd = cell.speed * (slowMode ? 0.7 : 1.0);
  if (spd > maxSpd) {
    cell.vx = (cell.vx / spd) * maxSpd;
    cell.vy = (cell.vy / spd) * maxSpd;
  }

  // Friction
  cell.vx *= 0.93;
  cell.vy *= 0.93;

  cell.x += cell.vx * dt;
  cell.y += cell.vy * dt;

  // World bounds
  if (cell.x < cell.radius) { cell.x = cell.radius; cell.vx = Math.abs(cell.vx) * 0.5; }
  if (cell.x > worldW - cell.radius) { cell.x = worldW - cell.radius; cell.vx = -Math.abs(cell.vx) * 0.5; }
  if (cell.y < cell.radius) { cell.y = cell.radius; cell.vy = Math.abs(cell.vy) * 0.5; }
  if (cell.y > worldH - cell.radius) { cell.y = worldH - cell.radius; cell.vy = -Math.abs(cell.vy) * 0.5; }

  // Physical wall collision (push out)
  for (const w of walls) {
    const dx = cell.x - w.x, dy = cell.y - w.y;
    const d = Math.hypot(dx, dy);
    const minD = cell.radius + w.radius;
    if (d < minD && d > 0) {
      cell.x = w.x + (dx / d) * minD;
      cell.y = w.y + (dy / d) * minD;
      // Bounce velocity
      const dot = cell.vx * (dx / d) + cell.vy * (dy / d);
      if (dot < 0) {
        cell.vx -= dot * (dx / d) * 1.2;
        cell.vy -= dot * (dy / d) * 1.2;
      }
    }
  }
}

// ==================== COMBAT ====================
function updateCombat(cell, dt) {
  if (!cell.alive) return;
  cell.attackTimer -= dt;

  if (cell.task !== 'hunt' || !cell.taskTarget || !cell.taskTarget.alive) {
    cell.target = null;
    return;
  }

  const target = cell.taskTarget;
  const d = dist(cell, target);

  if (d < cell.radius + target.radius + 6 && cell.attackTimer <= 0) {
    cell.attackTimer = cell.attackCooldown;
    cell.regenCombatNerf = 2 + cell.regen / 255;
    target.regenCombatNerf = 2;

    let dmg = cell.attackDamage * settings.dmgMult;
    const penetration = cell.strength / 255;
    const defense = target.armor / 255;
    dmg *= (1 - defense * 0.5);

    const critChance = settings.critChanceBase * (1 + penetration) * (1 - defense * 0.7);
    let isCrit = Math.random() < critChance;

    if (defense > 0.9 && penetration < 0.3) { isCrit = false; dmg *= 0.3; } // Full block

    let knockMult = 1;
    if (isCrit) {
      dmg *= 2.5;
      knockMult = 2;
      if (settings.hardDmgEnabled) {
        const hardDmg = dmg * 0.28;
        target.hardHp = Math.min(target.maxHp * 0.65, target.hardHp + hardDmg);
      }
      spawnParticles(target.x, target.y, 14, '#ff2222', 0.7, 70);
    } else {
      spawnParticles(target.x, target.y, 5, '#ffaa44', 0.3, 32);
    }

    target.hp -= dmg;

    // Knockback
    const ddx = target.x - cell.x, ddy = target.y - cell.y;
    const dd = Math.hypot(ddx, ddy) || 1;
    const kb = (cell.knockbackForce * knockMult) / target.mass;
    target.vx += (ddx / dd) * kb;
    target.vy += (ddy / dd) * kb;

    // Target retaliates
    target.attackedBy = cell;

    // Death
    if (target.hp <= 0) {
      target.alive = false;
      stats.kills++;
      spawnDeathParticles(target);
    }
  }
}

// ==================== ECONOMY ====================
function updateEconomy(cell, dt) {
  if (!cell.alive) return;

  // Energy drain
  let consumption = cell.energyConsumption * dt;
  if (cell.regenCombatNerf > 0) consumption *= 1.4;
  cell.energy -= consumption;

  // --- Normal HP regen (capped by hardHp zone) ---
  const healCap = cell.maxHp - cell.hardHp;
  if (cell.hp < healCap && cell.regenCombatNerf <= 0.3) {
    // Regen nerf: high regen cells recover faster from combat mode
    const regenFactor = cell.regenCombatNerf > 0 ? 0.2 : 1.0;

    // Check meat/plant ratio for regen nerf (regen cells need meat)
    const totalEaten = cell.meatEaten + cell.plantEaten + 0.01;
    const plantRatio = cell.plantEaten / totalEaten;
    const regenPlantNerf = (cell.regen > 150 && plantRatio > 0.6)
      ? Math.max(0.15, 1 - (plantRatio - 0.6) * 2)
      : 1.0;

    const healRate = cell.regenRate * regenFactor * regenPlantNerf;
    const healCost = healRate * 0.9 * dt;
    if (cell.energy > healCost) {
      cell.hp = Math.min(healCap, cell.hp + healRate * dt);
      cell.energy -= healCost;
    }
  }

  // --- Hard HP regen: 10× energy cost, very slow ---
  if (cell.hardHp > 0 && cell.regenCombatNerf <= 0) {
    const hardHealRate = cell.regenRate * 0.08; // very slow
    const hardHealCost = hardHealRate * 10 * dt; // 10× energy
    if (cell.energy > hardHealCost * 3) { // needs spare energy
      const healed = Math.min(hardHealRate * dt, cell.hardHp);
      cell.hardHp -= healed;
      cell.energy -= hardHealCost;
    }
  }

  // --- Eat plants ---
  if (cell.task === 'forage' && cell.taskTarget && cell.taskTarget.alive) {
    const t = cell.taskTarget;
    if (dist(cell, t) < cell.radius + t.radius + 2) {
      cell.energy = Math.min(cell.maxEnergy, cell.energy + t.energy);
      cell.plantEaten += t.energy;
      t.alive = false;
      spawnParticles(t.x, t.y, 4, '#44ff44', 0.3, 15);
      cell.taskTarget = null;
    }
  }

  // --- Eat meat ---
  if (cell.task === 'forage_meat' && cell.taskTarget && cell.taskTarget.alive) {
    const t = cell.taskTarget;
    if (dist(cell, t) < cell.radius + t.radius + 2) {
      cell.energy = Math.min(cell.maxEnergy, cell.energy + t.energy);
      cell.meatEaten += t.energy;
      t.alive = false;
      spawnParticles(t.x, t.y, 5, '#ff6644', 0.4, 20);
      cell.taskTarget = null;
    }
  }

  // NEW: Eat from food sources (stand near them to gain energy over time)
  if (cell.task === 'forage_source' && cell.taskTarget && cell.taskTarget.alive) {
    const t = cell.taskTarget;
    const d = dist(cell, t);
    if (d < cell.radius + t.radius + 30) {
      // Gain energy gradually when near a food source
      const gainRate = 8 * dt; // energy per second from source
      cell.energy = Math.min(cell.maxEnergy, cell.energy + gainRate);
      cell.plantEaten += gainRate;
    }
  }

  // Also eat nearby meat/plants regardless of task (proximity pickup)
  if (cell.task !== 'forage' && cell.task !== 'forage_meat' && cell.task !== 'forage_source') {
    for (const m of meats) {
      if (!m.alive) continue;
      if (dist(cell, m) < cell.radius + m.radius) {
        cell.energy = Math.min(cell.maxEnergy, cell.energy + m.energy);
        cell.meatEaten += m.energy;
        m.alive = false;
        break;
      }
    }
    for (const p of plants) {
      if (!p.alive) continue;
      if (dist(cell, p) < cell.radius + p.radius) {
        cell.energy = Math.min(cell.maxEnergy, cell.energy + p.energy);
        cell.plantEaten += p.energy;
        p.alive = false;
        break;
      }
    }
  }

  // Starvation: energy → hp bleed
  if (cell.energy <= 0) {
    cell.energy = 0;
    cell.hp -= 18 * dt;
    if (cell.hp <= 0) {
      cell.alive = false;
      stats.starve++;
      spawnDeathParticles(cell);
    }
  }

  cell.age += dt;
}

// ==================== SPAWN ====================
let plantSpawnAccum = 0;

function spawnPlants(dt) {
  plantSpawnAccum += settings.plantSpawnRate * dt;
  while (plantSpawnAccum >= 1) {
    plantSpawnAccum -= 1;
    // NEW: Spawn plants only in valid positions (not in walls)
    const margin = 20;
    const px = margin + Math.random() * (worldW - margin * 2);
    const py = margin + Math.random() * (worldH - margin * 2);
    const pos = findValidPositionNear(px, py, 5);
    if (pos.valid) {
      plants.push(createPlant(pos.x, pos.y));
    }
  }
}

// NEW: Spawn plants from food sources
function spawnFromSources(dt) {
  for (const source of foodSources) {
    if (!source.alive) continue;
    source.spawnTimer += dt * settings.sourceSpawnRate;
    while (source.spawnTimer >= 1) {
      source.spawnTimer -= 1;
      // Spawn plant near the source
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * settings.sourceSpawnRadius;
      const px = source.x + Math.cos(angle) * dist;
      const py = source.y + Math.sin(angle) * dist;
      
      // NEW: Ensure plant doesn't spawn in wall
      const pos = findValidPositionNear(px, py, 5);
      if (pos.valid) {
        plants.push(createPlant(pos.x, pos.y));
        source.plantsSpawned++;
      }
    }
  }
}

function spawnInitial() {
  cells = []; plants = []; meats = []; particles = []; walls = []; foodSources = [];
  stats = { kills: 0, births: 0, starve: 0 };
  popHistory = []; avgHistory = [];
  nextId = 1;

  for (let i = 0; i < settings.initCells; i++) {
    cells.push(createCell(
      worldW / 2 + (Math.random() - 0.5) * settings.spawnRadius,
      worldH / 2 + (Math.random() - 0.5) * settings.spawnRadius
    ));
  }
  // Spawn initial plants within bounds with margin (wall-safe)
  const margin = 20;
  for (let i = 0; i < 60; i++) {
    const px = margin + Math.random() * (worldW - margin * 2);
    const py = margin + Math.random() * (worldH - margin * 2);
    const pos = findValidPositionNear(px, py, 5);
    if (pos.valid) {
      plants.push(createPlant(pos.x, pos.y));
    }
  }
  
  // NEW: Spawn initial food sources
  for (let i = 0; i < settings.initSources; i++) {
    const sx = margin + Math.random() * (worldW - margin * 2);
    const sy = margin + Math.random() * (worldH - margin * 2);
    // Ensure source doesn't spawn in wall
    const pos = findValidPositionNear(sx, sy, 25);
    if (pos.valid) {
      foodSources.push(createFoodSource(pos.x, pos.y));
    }
  }
}

// ==================== UPDATE ====================
let statsTimer = 0;

function update(dt) {
  if (paused) return;
  dt *= timeScale;
  dt = Math.min(dt, 0.05);

  buildSpatialGrid();

  spawnPlants(dt);
  spawnFromSources(dt); // NEW: Spawn from food sources

  for (const cell of cells) {
    if (!cell.alive) continue;
    updateAI(cell, dt);
    updateMovement(cell, dt);
    updateCombat(cell, dt);
    updateEconomy(cell, dt);
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update meat drops (they slow down and linger)
  for (const m of meats) {
    if (!m.alive) continue;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.vx *= 0.94;
    m.vy *= 0.94;
    // Clamp to world
    m.x = Math.max(m.radius, Math.min(worldW - m.radius, m.x));
    m.y = Math.max(m.radius, Math.min(worldH - m.radius, m.y));
    m.life -= dt;
    if (m.life <= 0) m.alive = false;
  }

  // Clean up
  cells = cells.filter(c => c.alive);
  plants = plants.filter(p => p.alive);
  meats  = meats.filter(m => m.alive);
  foodSources = foodSources.filter(s => s.alive);

  if (particles.length > 3000) particles.splice(0, particles.length - 3000);
  if (meats.length > 500) meats.splice(0, meats.length - 500);

  // Stats history
  statsTimer += dt;
  if (statsTimer > 1) {
    statsTimer = 0;
    popHistory.push(cells.length);
    if (popHistory.length > 300) popHistory.shift();
    const n = cells.length || 1;
    avgHistory.push({
      str: cells.reduce((s, c) => s + c.strength, 0) / n,
      arm: cells.reduce((s, c) => s + c.armor, 0) / n,
      reg: cells.reduce((s, c) => s + c.regen, 0) / n,
    });
    if (avgHistory.length > 300) avgHistory.shift();
  }
}

// ==================== RENDER ====================
function worldToScreen(wx, wy) {
  return [(wx - cam.x) * cam.zoom + W / 2, (wy - cam.y) * cam.zoom + H / 2];
}
function screenToWorld(sx, sy) {
  return [(sx - W / 2) / cam.zoom + cam.x, (sy - H / 2) / cam.zoom + cam.y];
}

// Frustum cull helper
function inView(wx, wy, margin) {
  const [sx, sy] = worldToScreen(wx, wy);
  return sx > -margin && sx < W + margin && sy > -margin && sy < H + margin;
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  cam.zoom += (targetZoom - cam.zoom) * 0.15;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // World border
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, worldW, worldH);

  // Grid
  ctx.strokeStyle = '#0a0a0f';
  ctx.lineWidth = 0.5;
  const gs = 100;
  for (let x = 0; x <= worldW; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,worldH); ctx.stroke(); }
  for (let y = 0; y <= worldH; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(worldW,y); ctx.stroke(); }

  // Plants
  for (const p of plants) {
    if (!inView(p.x, p.y, 20)) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(30,${120 + Math.floor(p.energy * 1.5)},40,0.85)`;
    ctx.fill();
  }

  // Meat drops
  for (const m of meats) {
    if (!inView(m.x, m.y, 20)) continue;
    const alpha = Math.min(1, m.life / 10) * 0.9; // fade near end
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${m.r},${m.gb},${m.gb},${alpha})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(255,80,60,${alpha * 0.6})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // NEW: Food sources (with collision - drawn with solid border)
  for (const s of foodSources) {
    if (!inView(s.x, s.y, s.radius + 5)) continue;
    // Glow effect
    const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius * 2);
    gradient.addColorStop(0, 'rgba(255, 200, 100, 0.3)');
    gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Main body - solid fill to show collision
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcc44';
    ctx.fill();
    ctx.strokeStyle = '#ff8800'; // Darker orange border to show solidity
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Inner circle to emphasize collision boundary
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius * 0.9, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 100, 0, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Pulsing animation
    const pulse = Math.sin(Date.now() / 500) * 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius * 0.4 + pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#ffeeaa';
    ctx.fill();
  }

  // Walls
  for (const w of walls) {
    if (!inView(w.x, w.y, w.radius + 5)) continue;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#4a4a55';
    ctx.fill();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Particles
  for (const p of particles) {
    if (!inView(p.x, p.y, 10)) continue;
    const alpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.1, p.size * alpha), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha * 0.8;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Cells
  for (const cell of cells) {
    if (!cell.alive || !inView(cell.x, cell.y, cell.radius + 20)) continue;

    // Heartbeat pulse
    cell.heartbeatTimer -= 0.016;
    let pulse = 0;
    if (cell.heartbeatTimer <= 0) {
      cell.heartbeatTimer = 1.5 + Math.random() * 2.5;
      pulse = 1.5;
      if (Math.random() < 0.25) spawnParticles(cell.x, cell.y, 1, 'rgba(255,255,255,0.25)', 0.5, 12);
    }

    const r = cell.radius + pulse;

    // Body
    ctx.beginPath();
    ctx.arc(cell.x, cell.y, r, 0, Math.PI * 2);
    ctx.fillStyle = genomeColor(cell.genome);
    ctx.globalAlpha = 0.88;
    ctx.fill();
    ctx.globalAlpha = 1;

    // White outline
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Nucleus
    const nr = r * 0.35;
    ctx.beginPath();
    ctx.arc(cell.x, cell.y, nr, 0, Math.PI * 2);
    ctx.fillStyle = nucleusColor(cell.genome);
    ctx.globalAlpha = 0.92;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Nucleus pulse
    if (cell.task === 'idle') {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // HP bar above cell
    const barW = r * 2.6;
    const barH = 3;
    const barX = cell.x - barW / 2;
    const barY = cell.y - r - 7;
    const hpFrac = Math.max(0, cell.hp / cell.maxHp);
    const hardFrac = Math.min(1, cell.hardHp / cell.maxHp);

    // Background
    ctx.fillStyle = '#222';
    ctx.fillRect(barX, barY, barW, barH);

    // Hard zone — RIGHT side, dark red (blocks full recovery)
    if (hardFrac > 0) {
      ctx.fillStyle = '#6b0000';
      ctx.fillRect(barX + barW * (1 - hardFrac), barY, barW * hardFrac, barH);
    }

    // HP fill — green/yellow/red
    const hpColor = hpFrac > 0.6 ? '#3d9' : hpFrac > 0.3 ? '#da4' : '#d33';
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barW * hpFrac, barH);

    // Combat lines
    if (cell.target && cell.target.alive) {
      ctx.beginPath();
      ctx.moveTo(cell.x, cell.y);
      ctx.lineTo(cell.target.x, cell.target.y);
      ctx.strokeStyle = 'rgba(255,50,50,0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.stroke();
    }
    if (cell.teammate && cell.teammate.alive) {
      ctx.beginPath();
      ctx.moveTo(cell.x, cell.y);
      ctx.lineTo(cell.teammate.x, cell.teammate.y);
      ctx.strokeStyle = 'rgba(80,80,255,0.12)';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([3, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.restore();

  document.getElementById('stats').textContent =
    `Cells: ${cells.length} | Plants: ${plants.length} | Sources: ${foodSources.length} | Meat: ${meats.length}`;
}

// ==================== HOVER PANEL ====================
const hoverPanel = document.getElementById('hoverPanel');
let hoveredCell = null;

// Auto-update hover panel every frame instead of only on mousemove
function updateHoverPanel(mouseX, mouseY) {
  const [wx, wy] = screenToWorld(mouseX, mouseY - 36);
  hoveredCell = null;

  for (const cell of cells) {
    if (dist({ x: wx, y: wy }, cell) < cell.radius + 10) {
      hoveredCell = cell;
      break;
    }
  }

  if (hoveredCell) {
    const c = hoveredCell;
    const taskNames = {
      idle: '💃 Бездействие', forage: '🌿 Сбор растений', forage_meat: '🥩 Сбор мяса',
      forage_source: '🍄 У источника', hunt: '🎯 Охота', retreat: '🏃 Отступление', teamup: '🤝 Группировка'
    };
    const cdSec = c.attackCooldown.toFixed(2);
    const critPct = (settings.critChanceBase * (1 + c.strength / 255) * (1 - c.armor / 255 * 0.7) * 100).toFixed(1);
    const hungerTime = c.energyConsumption > 0 ? (c.energy / c.energyConsumption).toFixed(1) : '∞';
    const hardPct = (c.hardHp / c.maxHp * 100).toFixed(1);

    hoverPanel.innerHTML = `
      <div class="section-title">Клетка #${c.id}${c.parent ? ` (🧬 от #${c.parent})` : ''}</div>
      <div class="genome-bar">
        <div title="Сила" style="background:rgb(${c.genome[0]},0,0)"></div>
        <div title="Броня" style="background:rgb(0,0,${c.genome[1]})"></div>
        <div title="Реген" style="background:rgb(0,${c.genome[2]},0)"></div>
        <div title="Смелость" style="background:rgb(${c.genome[3]},0,0);opacity:0.6"></div>
        <div title="Стайность" style="background:rgb(0,0,${c.genome[4]});opacity:0.6"></div>
        <div title="Прожорливость" style="background:rgb(0,${c.genome[5]},0);opacity:0.6"></div>
      </div>
      <div class="stat-row"><span>❤️ HP:</span><span>${c.hp.toFixed(1)} / ${c.maxHp.toFixed(0)}</span></div>
      <div class="hp-bar" style="position:relative">
        <div class="hp-fill" style="width:${(c.hp/c.maxHp*100).toFixed(1)}%;background:${c.hp/c.maxHp>0.6?'#3d9':c.hp/c.maxHp>0.3?'#da4':'#d33'}"></div>
        ${c.hardHp > 0 ? `<div class="hard-zone" style="width:${hardPct}%"></div>` : ''}
      </div>
      ${c.hardHp > 0 ? `<div class="stat-row" style="color:#8b0000"><span>🩸 Хард-урон:</span><span>${hardPct}% (×10 энергии)</span></div>` : ''}
      <div class="stat-row"><span>⚡ Энергия:</span><span>${c.energy.toFixed(1)} / ${c.maxEnergy.toFixed(0)}</span></div>
      <div class="stat-row"><span>💀 До голода:</span><span>${hungerTime}с</span></div>
      <div class="section-title">Характеристики</div>
      <div class="stat-row"><span>🔴 Сила:</span><span>${c.strength} | Урон: ${c.attackDamage.toFixed(1)}</span></div>
      <div class="stat-row"><span>🔵 Броня:</span><span>${c.armor} | Масса: ${c.mass.toFixed(2)}</span></div>
      <div class="stat-row"><span>🟢 Реген:</span><span>${c.regen} | ${c.regenRate.toFixed(2)} hp/s</span></div>
      <div class="stat-row"><span>КД атаки:</span><span>${cdSec}с ${c.attackTimer > 0 ? '⏳' : '✅'}</span></div>
      <div class="stat-row"><span>Крит шанс:</span><span>${critPct}%</span></div>
      <div class="section-title">Ядро (мозг)</div>
      <div class="stat-row"><span>🔴 Смелость:</span><span>${c.courage}</span></div>
      <div class="stat-row"><span>🔵 Стайность:</span><span>${c.sociability}</span></div>
      <div class="stat-row"><span>🟢 Прожорливость:</span><span>${c.greed}</span></div>
      <div class="section-title">Статистика ядра</div>
      <div class="stat-row"><span>🔴 Красное:</span><span>${c.genome[3]}</span></div>
      <div class="stat-row"><span>🔵 Синее:</span><span>${c.genome[4]}</span></div>
      <div class="stat-row"><span>🟢 Зеленое:</span><span>${c.genome[5]}</span></div>
      <div class="section-title">Поведение</div>
      <div class="stat-row"><span>Задача:</span><span>${taskNames[c.task] || c.task}</span></div>
      <div class="stat-row"><span>Возраст:</span><span>${c.age.toFixed(1)}с</span></div>
      ${c.teammate && c.teammate.alive ? `<div class="stat-row"><span>🤝 Товарищ:</span><span>#${c.teammate.id}</span></div>` : ''}
      ${c.children.length ? `<div class="stat-row"><span>👶 Детей:</span><span>${c.children.length}</span></div>` : ''}
    `;

    let px = mouseX + 15, py = mouseY + 15;
    if (px + 290 > W) px = mouseX - 295;
    if (py + 440 > H) py = Math.max(36, H - 444);

    hoverPanel.style.left = px + 'px';
    hoverPanel.style.top = py + 'px';
    hoverPanel.style.display = 'block';
  } else {
    hoverPanel.style.display = 'none';
  }
}

// Track last mouse position for auto-update
let lastMouseX = 0, lastMouseY = 0;

canvas.addEventListener('mousemove', (e) => {
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  updateHoverPanel(e.clientX, e.clientY);
});

// ==================== INPUT ====================
let isDragging = false, dragStart = { x: 0, y: 0 }, camStart = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 1 || (e.button === 0 && e.shiftKey) || e.button === 2) {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    camStart = { x: cam.x, y: cam.y };
    return;
  }
  if (e.button === 0) {
    const [wx, wy] = screenToWorld(e.clientX, e.clientY - 36);
    switch (currentTool) {
      case 'spawn':
        cells.push(createCell(wx, wy));
        break;
      case 'plant':
        // NEW: Spawn plants wall-safe
        for (let i = 0; i < 5; i++) {
          const pos = findValidPositionNear(wx + (Math.random()-0.5)*30, wy + (Math.random()-0.5)*30, 5);
          if (pos.valid) plants.push(createPlant(pos.x, pos.y));
        }
        break;
      case 'foodSource':
        // NEW: Place food source (wall-safe)
        const pos = findValidPositionNear(wx, wy, 25);
        if (pos.valid) foodSources.push(createFoodSource(pos.x, pos.y));
        break;
      case 'wall':
        walls.push({ x: wx, y: wy, radius: 15 });
        break;
      case 'erase': {
        let bestDist = 35, bestObj = null, bestType = '';
        for (const c of cells) {
          const d = dist({ x: wx, y: wy }, c);
          if (d < bestDist) { bestDist = d; bestObj = c; bestType = 'cell'; }
        }
        for (const w of walls) {
          const d = dist({ x: wx, y: wy }, w);
          if (d < bestDist) { bestDist = d; bestObj = w; bestType = 'wall'; }
        }
        for (const s of foodSources) {
          const d = dist({ x: wx, y: wy }, s);
          if (d < bestDist) { bestDist = d; bestObj = s; bestType = 'source'; }
        }
        if (bestType === 'cell') { bestObj.alive = false; spawnDeathParticles(bestObj); }
        else if (bestType === 'wall') walls.splice(walls.indexOf(bestObj), 1);
        else if (bestType === 'source') bestObj.alive = false;
        break;
      }
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    cam.x = camStart.x - (e.clientX - dragStart.x) / cam.zoom;
    cam.y = camStart.y - (e.clientY - dragStart.y) / cam.zoom;
  }
});

canvas.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetZoom = Math.max(0.1, Math.min(6, targetZoom * (e.deltaY > 0 ? 0.9 : 1.1)));
}, { passive: false });

// ==================== UI ====================
document.getElementById('btnPause').onclick = () => { paused = !paused; };
document.getElementById('btnPlay').onclick  = () => { paused = false; };

const speedSlider = document.getElementById('speedSlider');
speedSlider.oninput = () => {
  timeScale = parseFloat(speedSlider.value);
  document.getElementById('speedVal').textContent = timeScale.toFixed(1) + 'x';
};

const toolBtns = { btnSpawn: 'spawn', btnPlant: 'plant', btnFoodSource: 'foodSource', btnWall: 'wall', btnErase: 'erase' };
const toolNames = { spawn: 'Spawn Cell (click)', plant: 'Plant Food (click)', foodSource: 'Place Food Source (click)', wall: 'Place Wall (click)', erase: 'Erase (click)' };
Object.entries(toolBtns).forEach(([id, tool]) => {
  document.getElementById(id).onclick = () => {
    currentTool = tool;
    Object.keys(toolBtns).forEach(b => document.getElementById(b).classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('toolIndicator').textContent = 'Tool: ' + toolNames[tool];
  };
});

document.getElementById('btnSettings').onclick = () => {
  const p = document.getElementById('settingsPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  document.getElementById('statsPanel').style.display = 'none';
};
document.getElementById('btnStats').onclick = () => {
  const p = document.getElementById('statsPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  document.getElementById('settingsPanel').style.display = 'none';
};

function bindSlider(id, valId, setter) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.oninput = () => { const v = parseFloat(el.value); valEl.textContent = v; setter(v); };
}
bindSlider('setSpawnRadius', 'spawnRadVal', v => settings.spawnRadius = v);
bindSlider('setPlantRate',   'plantRateVal', v => settings.plantSpawnRate = v);
bindSlider('setPlantEnergy', 'plantEnergyVal', v => settings.plantEnergy = v);
bindSlider('setSourceRate',  'sourceRateVal', v => settings.sourceSpawnRate = v);
bindSlider('setSourceRadius','sourceRadVal', v => settings.sourceSpawnRadius = v);
bindSlider('setDmgMult',     'dmgMultVal', v => settings.dmgMult = v);
bindSlider('setCritChance',  'critVal', v => settings.critChanceBase = v);
bindSlider('setCellSize',    'cellSizeVal', v => settings.cellBaseSize = v);

document.getElementById('setHardDmg').onchange = function() { settings.hardDmgEnabled = this.checked; };
document.getElementById('setRandomSpawn').onchange = function() { settings.randomSpawn = this.checked; };

document.getElementById('btnResetWorld').onclick = () => {
  worldW = parseInt(document.getElementById('setWorldW').value) || 2000;
  worldH = parseInt(document.getElementById('setWorldH').value) || 1500;
  settings.initCells = parseInt(document.getElementById('setInitCells').value) || 30;
  settings.initSources = parseInt(document.getElementById('setInitSources').value) || 5;
  cam.x = worldW / 2; cam.y = worldH / 2; targetZoom = 1;
  spawnInitial();
};

// ==================== STATS CHARTS ====================
function drawStatsPanel() {
  if (document.getElementById('statsPanel').style.display === 'none') return;
  document.getElementById('statCells').textContent = cells.length;
  document.getElementById('statPlants').textContent = plants.length + ' (+' + meats.length + ' мяса)';
  document.getElementById('statSources').textContent = foodSources.length;
  document.getElementById('statKills').textContent = stats.kills;
  document.getElementById('statBirths').textContent = stats.births;
  document.getElementById('statStarve').textContent = stats.starve;

  const popCanvas = document.getElementById('popChart');
  const pctx = popCanvas.getContext('2d');
  pctx.fillStyle = '#0a0a0a'; pctx.fillRect(0, 0, 300, 100);
  if (popHistory.length > 1) {
    const mx = Math.max(...popHistory, 1);
    pctx.beginPath(); pctx.strokeStyle = '#4d9'; pctx.lineWidth = 1.5;
    popHistory.forEach((v, i) => {
      const x = i / (popHistory.length - 1) * 300, y = 100 - v / mx * 90;
      i === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    }); pctx.stroke();
  }

  const stCanvas = document.getElementById('statChart');
  const sctx = stCanvas.getContext('2d');
  sctx.fillStyle = '#0a0a0a'; sctx.fillRect(0, 0, 300, 100);
  if (avgHistory.length > 1) {
    const drawLine = (key, color) => {
      sctx.beginPath(); sctx.strokeStyle = color; sctx.lineWidth = 1.5;
      avgHistory.forEach((v, i) => {
        const x = i / (avgHistory.length - 1) * 300, y = 100 - (v[key] / 255) * 90;
        i === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
      }); sctx.stroke();
    };
    drawLine('str', '#f44'); drawLine('arm', '#44f'); drawLine('reg', '#4f4');
    sctx.font = '10px sans-serif';
    sctx.fillStyle = '#f44'; sctx.fillText('Сила', 5, 12);
    sctx.fillStyle = '#44f'; sctx.fillText('Броня', 42, 12);
    sctx.fillStyle = '#4f4'; sctx.fillText('Реген', 84, 12);
  }
}

// ==================== MAIN LOOP ====================
let lastTime = 0;

function gameLoop(time) {
  const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 0.016;
  lastTime = time;
  update(dt);
  render();
  drawStatsPanel();
  // Auto-update hover panel every frame for real-time stat updates
  if (lastMouseX > 0 && lastMouseY > 0) {
    updateHoverPanel(lastMouseX, lastMouseY);
  }
  requestAnimationFrame(gameLoop);
}

cam.x = worldW / 2;
cam.y = worldH / 2;
spawnInitial();
requestAnimationFrame(gameLoop);
</script>
</body>
